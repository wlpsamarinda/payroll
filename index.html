<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sistem Gaji - Wonderland Park Samarinda</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Sistem Manajemen Gaji Karyawan Wonderland Park Samarinda">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gaji WLP">
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ============ BASE & VARIABLES ============ */
:root{
  --navy:#0f172a; --navy2:#1e293b; --navy3:#334155;
  --accent:#f59e0b; --accent2:#fbbf24;
  --green:#16a34a; --red:#dc2626; --blue:#2563eb; --purple:#8b5cf6;
  --bg:#f1f5f9; --card:#ffffff; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b;
  --radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
h1,h2,h3,h4{margin:0 0 4px 0;}
a{text-decoration:none;color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}

/* ============ LOGIN ============ */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--navy) 0%,#1e3a5f 50%,var(--navy2) 100%);padding:20px;}
.login-card{background:var(--card);border-radius:16px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:center;}
.login-logo{font-size:48px;margin-bottom:8px;}
.login-card h1{font-size:19px;color:var(--navy);}
.login-sub{color:var(--muted);margin:0 0 20px 0;font-size:13px;}
.login-card form{text-align:left;}
.login-card label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px;}
.login-card input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;outline:none;transition:.15s;}
.login-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,158,11,.15);}
.login-hint{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.5;}
.btn{border:none;border-radius:8px;padding:10px 16px;font-weight:600;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px;justify-content:center;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy2);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{background:#d97706;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{background:#f8fafc;}
.btn-danger{background:#fef2f2;color:var(--red);}
.btn-danger:hover{background:#fee2e2;}
.btn-block{width:100%;margin-top:14px;}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ============ APP SHELL ============ */
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:250px;background:var(--navy);color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:.2s;}
.sidebar-header{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-logo{font-size:26px;}
.sidebar-title{font-weight:700;font-size:14px;}
.sidebar-build{font-size:10px;color:#94a3b8;}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#cbd5e1;font-size:13px;margin-bottom:2px;}
.nav-item span{font-size:15px;width:18px;text-align:center;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600;}
.sidebar-footer{padding:14px;border-top:1px solid rgba(255,255,255,.08);}
.user-chip{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;}
.user-name{font-size:13px;font-weight:600;}
.user-role{font-size:11px;color:#94a3b8;}
.main-area{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;}
.hamburger{display:none;background:none;border:none;font-size:20px;}
.topbar-title{font-size:17px;font-weight:700;flex:1;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.periode-select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-weight:600;}
.content{padding:22px;position:relative;min-height:calc(100vh - 60px);}

/* ============ CARDS / GRID ============ */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border);}
.stat-card{display:flex;flex-direction:column;gap:4px;}
.stat-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.stat-value{font-size:24px;font-weight:800;color:var(--navy);}
.stat-icon{font-size:20px;}
.card-title{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--navy);display:flex;align-items:center;justify-content:space-between;}

/* ============ TABLE ============ */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px;}
thead th{background:#f8fafc;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;}
tbody td{padding:9px 12px;border-bottom:1px solid #f1f5f9;white-space:nowrap;}
tbody tr:hover{background:#f8fafc;}
.text-right{text-align:right;}
.text-center{text-align:center;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:#dcfce7;color:#166534;}
.badge-red{background:#fee2e2;color:#991b1b;}
.badge-amber{background:#fef3c7;color:#92400e;}
.badge-blue{background:#dbeafe;color:#1e40af;}
.badge-gray{background:#f1f5f9;color:#475569;}

/* ============ FORMS ============ */
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;outline:none;}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--accent);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.toolbar .search-input{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;}
.spacer{flex:1;}

/* ============ MODAL ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-box{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-header h3{font-size:16px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--muted);}
.modal-body{padding:20px 22px;}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

/* ============ TOAST ============ */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{padding:12px 18px;border-radius:8px;color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.2);animation:slideIn .2s ease;max-width:320px;}
.toast-success{background:var(--green);}
.toast-error{background:var(--red);}
.toast-info{background:var(--blue);}
@keyframes slideIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* ============ MISC ============ */
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:10px;}
.alert-error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}
.alert-info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;}
.loading-overlay{position:absolute;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:10;}
.spinner{width:34px;height:34px;border:3px solid #e2e8f0;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state .icon{font-size:40px;margin-bottom:10px;}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:16px;flex-wrap:wrap;}
.tab-item{padding:9px 16px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;}
.tab-item.active{color:var(--accent);border-color:var(--accent);}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.attn-cell{position:relative;width:34px;height:34px;text-align:center;line-height:34px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer;border:1px solid var(--border);user-select:none;}
.attn-cell:hover{outline:2px solid var(--accent);}
.attn-cell.has-note::after{content:'';position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:#f97316;box-shadow:0 0 0 1px #fff;}
.lembur-cell-wrap{position:relative;display:inline-block;}
.lembur-note-dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#f97316;border:1px solid #fff;cursor:pointer;}
.sticky-col{position:sticky;left:0;background:#fff;z-index:5;}
.print-only{display:none;}
@media print{
  .sidebar,.topbar,.toolbar,.toast-container,.no-print{display:none !important;}
  .content{padding:0;}
  .print-only{display:block;}
}
@media(max-width:900px){
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:50;}
  .sidebar.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.4);}
  .hamburger{display:block;}
}

/* ============ PWA / MOBILE ============ */
html{-webkit-text-size-adjust:100%;}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;}
button,.nav-item,.tab-item,.attn-cell{touch-action:manipulation;}
.attn-cell{-webkit-touch-callout:none;}
.topbar{padding-top:calc(14px + env(safe-area-inset-top));padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right));}
.sidebar{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
.toast-container{bottom:calc(20px + env(safe-area-inset-bottom));}
.hamburger{padding:6px 8px;margin:-6px 0 -6px -8px;min-width:40px;min-height:40px;}
@media(max-width:900px){
  .sidebar-nav{-webkit-overflow-scrolling:touch;}
  .nav-item{padding:13px 12px;font-size:14px;}
  .content{padding:14px 12px calc(20px + env(safe-area-inset-bottom));}
  .topbar{gap:8px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));}
  .topbar-title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .topbar-right{gap:6px;flex-shrink:0;}
  .periode-select{max-width:128px;padding:8px 6px;font-size:13px;text-overflow:ellipsis;}
  #refreshDataBtn{padding:8px 11px;font-size:16px;min-width:42px;}
  #refreshDataBtn .lbl{display:none;}
  .btn{min-height:40px;}
  .btn-sm{min-height:34px;}
  .card{padding:14px;}
  .toolbar{gap:8px;}
  .toolbar .btn{flex:0 0 auto;}
  .toolbar .search-input{min-width:0;flex:1 1 100%;}
  .toolbar .chip-row{flex:1 1 100%;}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-item{white-space:nowrap;flex:0 0 auto;}
  .table-wrap{-webkit-overflow-scrolling:touch;}
  thead th,tbody td{padding:8px 9px;}
  .toast-container{left:12px;right:12px;}
  .toast{max-width:none;}
  /* kolom nama karyawan lebih ramping agar grid absensi/lembur muat banyak tanggal */
  th.sticky-col{min-width:118px !important;}
  .sticky-col{max-width:132px;white-space:normal;}
  /* 16px mencegah iOS memperbesar layar otomatis saat input difokuskan */
  input,select,textarea{font-size:16px !important;}
  .lembur-input{width:56px !important;}
}
@media(max-width:640px){
  .grid-4{grid-template-columns:repeat(2,1fr);gap:10px;}
  .grid{gap:10px;}
  .stat-value{font-size:16px;word-break:break-word;}
  .stat-label{font-size:10.5px;}
  .modal-overlay{align-items:flex-end;padding:0;}
  .modal-box{max-width:100%;border-radius:16px 16px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom);}
  .modal-header,.modal-body,.modal-footer{padding-left:16px;padding-right:16px;}
  .modal-footer{flex-wrap:wrap;}
  .modal-footer .btn{flex:1 1 auto;}
  .login-card{padding:28px 20px;}
}

/* Tabel -> kartu di layar HP (dipakai Master Karyawan) */
@media(max-width:640px){
  .table-wrap:has(.tbl-cards){background:transparent;border:0;box-shadow:none;overflow:visible;}
  .tbl-cards,.tbl-cards tbody,.tbl-cards tr,.tbl-cards td{display:block;width:100%;}
  .tbl-cards thead{display:none;}
  .tbl-cards tr{background:#fff;border:1px solid var(--border);border-radius:12px;margin:0 0 10px;padding:6px 12px;box-shadow:0 1px 2px rgba(15,23,42,.05);}
  .tbl-cards td{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:6px 0;border:0 !important;text-align:right;}
  .tbl-cards td::before{content:attr(data-label);color:var(--muted);font-weight:600;font-size:12px;text-align:left;flex:0 0 auto;}
  .tbl-cards td.td-nama{font-size:15px;padding-top:8px;}
  .tbl-cards td[data-label="Aksi"]{justify-content:flex-end;border-top:1px dashed var(--border) !important;margin-top:4px;padding-top:10px;}
  .tbl-cards td[data-label="Aksi"]::before{display:none;}
}
@media (display-mode: standalone){
  body{user-select:none;-webkit-user-select:none;}
  input,textarea,select,.table-wrap,.card{user-select:text;-webkit-user-select:text;}
}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div id="loginLogoContainer"></div>
    <h1>WONDERLAND PARK SAMARINDA</h1>
    <p class="login-sub">Sistem Manajemen Gaji Karyawan</p>

    <form id="loginForm">
      <label>Username</label>
      <input type="text" id="loginUsername" autocomplete="username" required>
      <label>Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Masuk</button>
    </form>
    <button class="btn btn-ghost btn-block" id="installAppBtn" type="button" style="display:none;">📲 Pasang Aplikasi di Layar Utama</button>
  </div>
</div>

<div id="appScreen" class="app-shell" style="display:none;">
  <div id="sidebarOverlay" class="no-print" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div id="sidebarLogoContainer" style="display:flex;align-items:center;gap:10px;"></div>
      <div>
        <div class="sidebar-title">Wonderland Gaji</div>
        <div class="sidebar-build" id="buildLabel"></div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <a data-page="dashboard" class="nav-item active"><span>📊</span>Dashboard</a>
      <a data-page="karyawan" class="nav-item"><span>👥</span>Master Karyawan</a>
      <a data-page="absensi" class="nav-item"><span>🗓️</span>Absensi Harian</a>
      <a data-page="rekapabsensi" class="nav-item"><span>📋</span>Rekap Absensi (Real)</a>
      <a data-page="lembur" class="nav-item"><span>⏱️</span>Rekap Lembur</a>
      <a data-page="kpirank" class="nav-item"><span>🏅</span>Ranking KPI Kehadiran</a>
      <a data-page="komponen" class="nav-item"><span>💰</span>Komponen Gaji</a>
      <a data-page="perhitungan" class="nav-item"><span>🧮</span>Perhitungan Gaji</a>
      <a data-page="slip" class="nav-item"><span>🧾</span>Slip Gaji</a>
      <a data-page="tandaterima" class="nav-item"><span>✍️</span>Tanda Terima</a>
      <a data-page="importexport" class="nav-item"><span>📁</span>Import / Export</a>
      <a data-page="pengaturan" class="nav-item"><span>⚙️</span>Pengaturan</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">A</div>
        <div>
          <div class="user-name" id="userName">-</div>
          <div class="user-role" id="userRole">-</div>
        </div>
      </div>
      <button class="btn btn-accent btn-block" id="installAppBtn2" type="button" style="display:none;margin-bottom:8px;">📲 Pasang Aplikasi</button>
      <button class="btn btn-ghost btn-block" id="logoutBtn" type="button">Keluar</button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <button class="hamburger" id="hamburgerBtn" type="button">☰</button>
      <div class="topbar-title" id="pageTitle">Dashboard</div>
      <div class="topbar-right">
        <select id="periodeSelector" class="periode-select"></select>
        <button class="btn btn-ghost" id="refreshDataBtn" type="button" title="Sinkronkan ulang data dari database" aria-label="Refresh Data">🔄<span class="lbl"> Refresh Data</span></button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>
<div id="modalRoot"></div>

<script>
/* ============================================================================
   STATE & UTIL
   ============================================================================ */
var STATE = {
  token: localStorage.getItem('wlp_token') || null,
  user: null,
  page: 'dashboard',
  periode: null,
  periodeList: [],
  karyawan: [],
  kodeAbsensi: [],
  pengaturan: [],
  cacheAbsensi: {},
  cacheKomponen: {},
  cachePerhitungan: {}
};

function gsRun(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  var url = (window.APP_CONFIG && window.APP_CONFIG.API_URL) || '';
  if (!url) return Promise.reject(new Error('API_URL belum diisi di config.js'));
  return fetch(url, {
    method: 'POST',
    // text/plain menghindari preflight CORS yang tidak didukung Google Apps Script
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fnName, args: args }),
    redirect: 'follow'
  }).then(function (r) {
    if (!r.ok) throw new Error('Server merespons ' + r.status);
    return r.json();
  }).then(function (res) {
    if (!res || res.ok === false) throw new Error((res && res.error) || 'Terjadi kesalahan di server.');
    return res.result;
  }).catch(function (err) {
    if (err instanceof TypeError) throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet Anda.');
    throw err;
  });
}

// Konversi angka (rupiah) menjadi terbilang Bahasa Indonesia, mis. 2105232 -> "Dua Juta Seratus Lima Ribu Dua Ratus Tiga Puluh Dua Rupiah"
function terbilang_(n) {
  n = Math.floor(Math.abs(Number(n) || 0));
  var satuan = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];
  function convert(num) {
    num = Math.floor(num);
    if (num < 12) return satuan[num];
    if (num < 20) return convert(num - 10) + ' Belas';
    if (num < 100) return convert(Math.floor(num / 10)) + ' Puluh' + (num % 10 !== 0 ? ' ' + convert(num % 10) : '');
    if (num < 200) return 'Seratus' + (num % 100 !== 0 ? ' ' + convert(num % 100) : '');
    if (num < 1000) return convert(Math.floor(num / 100)) + ' Ratus' + (num % 100 !== 0 ? ' ' + convert(num % 100) : '');
    if (num < 2000) return 'Seribu' + (num % 1000 !== 0 ? ' ' + convert(num % 1000) : '');
    if (num < 1000000) return convert(Math.floor(num / 1000)) + ' Ribu' + (num % 1000 !== 0 ? ' ' + convert(num % 1000) : '');
    if (num < 1000000000) return convert(Math.floor(num / 1000000)) + ' Juta' + (num % 1000000 !== 0 ? ' ' + convert(num % 1000000) : '');
    if (num < 1000000000000) return convert(Math.floor(num / 1000000000)) + ' Miliar' + (num % 1000000000 !== 0 ? ' ' + convert(num % 1000000000) : '');
    return convert(Math.floor(num / 1000000000000)) + ' Triliun' + (num % 1000000000000 !== 0 ? ' ' + convert(num % 1000000000000) : '');
  }
  if (n === 0) return 'Nol';
  return convert(n).replace(/\s+/g, ' ').trim();
}

function terbilangRupiah_(n) {
  return terbilang_(n) + ' Rupiah';
}

function fmtTanggal(s) {
  if (!s) return '-';
  var d = new Date(s + 'T00:00:00');
  if (isNaN(d.getTime())) return s;
  var bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  return d.getDate() + ' ' + bulan[d.getMonth()] + ' ' + d.getFullYear();
}

// Peta nama bulan Bahasa Indonesia -> index bulan (0 = Januari), dipakai untuk membaca
// data Tanggal_Masuk/Tanggal_Lahir lama yang sempat diketik manual dalam format teks
// seperti "28 Maret 2024" (bukan format ISO "yyyy-MM-dd" yang dipakai input tanggal HTML).
var BULAN_ID_MAP_ = { januari: 0, februari: 1, maret: 2, april: 3, mei: 4, juni: 5, juli: 6, agustus: 7, september: 8, oktober: 9, november: 10, desember: 11 };

// Parser tanggal fleksibel: menerima format ISO ("2026-05-17"), format teks Indonesia
// ("28 Maret 2024"), atau fallback ke parser tanggal bawaan browser. Mengembalikan objek
// Date atau null kalau benar-benar tidak bisa dibaca.
function parseTanggalFleksibel_(s) {
  if (!s) return null;
  s = String(s).trim();
  var iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) {
    var d = new Date(parseInt(iso[1], 10), parseInt(iso[2], 10) - 1, parseInt(iso[3], 10));
    return isNaN(d.getTime()) ? null : d;
  }
  var teks = s.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);
  if (teks) {
    var bulanIdx = BULAN_ID_MAP_[teks[2].toLowerCase()];
    if (bulanIdx !== undefined) {
      var d2 = new Date(parseInt(teks[3], 10), bulanIdx, parseInt(teks[1], 10));
      return isNaN(d2.getTime()) ? null : d2;
    }
  }
  var d3 = new Date(s);
  return isNaN(d3.getTime()) ? null : d3;
}

// Menghitung lama bekerja (dari Tanggal_Masuk sampai hari ini) dalam format "X thn Y bln".
// Menerima Tanggal_Masuk dalam format ISO ATAU teks Indonesia lama ("28 Maret 2024").
function hitungLamaBekerja(tglMasuk) {
  var mulai = parseTanggalFleksibel_(tglMasuk);
  if (!mulai) return '-';
  var now = new Date();
  if (mulai > now) return '-';
  var tahun = now.getFullYear() - mulai.getFullYear();
  var bulan = now.getMonth() - mulai.getMonth();
  var hari = now.getDate() - mulai.getDate();
  if (hari < 0) bulan--;
  if (bulan < 0) { tahun--; bulan += 12; }
  var parts = [];
  if (tahun > 0) parts.push(tahun + ' thn');
  parts.push(bulan + ' bln');
  return parts.join(' ');
}

function resizeImageForUpload_(file, maxW, maxH) {
  return new Promise(function (resolve, reject) {
    if (!file) { reject(new Error('File tidak ditemukan.')); return; }
    if (!/^image\/(png|jpe?g)$/i.test(file.type)) { reject(new Error('Format file harus PNG atau JPG.')); return; }
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('Gagal membaca file.')); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error('File gambar tidak valid.')); };
      img.onload = function () {
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxW / w, maxH / h);
        var outW = Math.max(1, Math.round(w * scale));
        var outH = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = outW; canvas.height = outH;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, outW, outH);
        resolve(canvas.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function pdfImgFormat_(mime) {
  return /png/i.test(mime || '') ? 'PNG' : 'JPEG';
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function todayPeriode() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function periodeLabel(p) {
  if (!p) return '-';
  var bln = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  var parts = p.split('-');
  var m = parseInt(parts[1], 10);
  return bln[m - 1] + ' ' + parts[0];
}

function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }

function computeDefaultPeriodeRangeJS(periode) {
  var parts = periode.split('-');
  var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
  var startY = y, startM = m - 1;
  if (startM < 1) { startM = 12; startY -= 1; }
  return { mulai: startY + '-' + pad2(startM) + '-26', selesai: y + '-' + pad2(m) + '-25' };
}

function getPeriodeRange(periode) {
  var p = STATE.periodeList.find(function (x) { return x.Periode === periode; });
  if (p && p.Tanggal_Mulai && p.Tanggal_Selesai) return { mulai: p.Tanggal_Mulai, selesai: p.Tanggal_Selesai };
  return computeDefaultPeriodeRangeJS(periode);
}

function dateRangeArray(mulai, selesai) {
  var dates = [];
  var d = new Date(mulai + 'T00:00:00');
  var end = new Date(selesai + 'T00:00:00');
  var guard = 0;
  while (d <= end && guard < 400) {
    dates.push(d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()));
    d.setDate(d.getDate() + 1);
    guard++;
  }
  return dates;
}

function periodeRangeLabel(periode) {
  var r = getPeriodeRange(periode);
  return fmtTanggal(r.mulai) + ' – ' + fmtTanggal(r.selesai);
}

// Aksi "klik kanan" di desktop = "tekan lama" (500 ms) di layar sentuh.
function addContextAction_(el, handler) {
  var timer = null, fired = false, sx = 0, sy = 0;
  function run() {
    if (document.getElementById('modalOverlay')) return; // cegah modal ganda (contextmenu + long-press)
    handler();
  }
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); run(); });
  el.addEventListener('touchstart', function (e) {
    fired = false;
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    clearTimeout(timer);
    timer = setTimeout(function () { fired = true; if (navigator.vibrate) { try { navigator.vibrate(15); } catch (x) {} } run(); }, 500);
  }, { passive: true });
  el.addEventListener('touchmove', function (e) {
    var t = e.touches[0];
    if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) clearTimeout(timer);
  }, { passive: true });
  el.addEventListener('touchend', function (e) {
    clearTimeout(timer);
    if (fired) { e.preventDefault(); fired = false; } // jangan ikut memicu klik (ganti kode absensi)
  }, { passive: false });
  el.addEventListener('touchcancel', function () { clearTimeout(timer); fired = false; });
}

function ensureCurrentPeriodeExists() {
  var tp = todayPeriode();
  var found = STATE.periodeList.find(function (p) { return p.Periode === tp; });
  if (found) { STATE.periode = tp; return Promise.resolve(); }
  if (STATE.periodeList.length > 0) {
    STATE.periode = STATE.periodeList[0].Periode;
    return Promise.resolve();
  }
  var range = computeDefaultPeriodeRangeJS(tp);
  var item = {
    Periode: tp, Label: periodeLabel(tp),
    Tanggal_Mulai: range.mulai, Tanggal_Selesai: range.selesai,
    Divisor_Hari: 31, Status: 'Draft'
  };
  return gsRun('savePeriode', STATE.token, item).then(function () {
    return gsRun('getPeriodeList', STATE.token).then(function (list) {
      STATE.periodeList = list;
      STATE.periode = tp;
    });
  });
}

    }).catch(function () { toast('Tidak dapat terhubung ke server. Periksa koneksi internet lalu muat ulang.', 'error'); });
  }
});

function statCard(icon, label, value, color) {
  return '<div class="card stat-card"><div class="stat-label">' + icon + ' ' + esc(label) + '</div>' +
    '<div class="stat-value" style="color:' + color + '">' + value + '</div></div>';
}

function ulangTahunTable(arr) {
  if (!arr || arr.length === 0) return '<div class="empty-state"><div class="icon">🎂</div>Tidak ada karyawan yang berulang tahun bulan ini</div>';
  var bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  var rows = arr.map(function (k, i) {
    var bagian = String(k.Tanggal_Lahir || '').split('-');
    var tglLabel = bagian.length >= 3 ? (parseInt(bagian[2], 10) + ' ' + bulan[parseInt(bagian[1], 10) - 1]) : '-';
    return '<tr><td>' + (i + 1) + '</td><td>' + esc(k.Nama) + '</td><td>' + esc(k.Jabatan) + '</td><td class="text-center"><b>' + tglLabel + '</b></td></tr>';
  }).join('');
  return '<div class="table-wrap"><table><thead><tr><th>#</th><th>Nama</th><th>Jabatan</th><th class="text-center">Tanggal Lahir</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function topListTable(arr, field, unit) {
  if (!arr || arr.length === 0) return '<div class="empty-state"><div class="icon">📭</div>Tidak ada data</div>';
  var rows = arr.map(function (d, i) {
    return '<tr><td>' + (i + 1) + '</td><td>' + esc(d.Nama) + '</td><td>' + esc(d.Jabatan) + '</td><td class="text-right"><b>' + d[field] + ' ' + unit + '</b></td></tr>';
  }).join('');
  return '<div class="table-wrap"><table><thead><tr><th>#</th><th>Nama</th><th>Jabatan</th><th class="text-right">Jumlah</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function topKPITable(arr) {
  if (!arr || arr.length === 0) return '<div class="empty-state"><div class="icon">📭</div>Belum ada data KPI (pastikan ada hari kerja wajib)</div>';
  var rows = arr.map(function (d, i) {
    return '<tr><td>' + (i + 1) + '</td><td>' + esc(d.Nama) + '</td><td>' + esc(d.hariKerjaWajib) + ' hari</td><td class="text-right"><b>' + d.kpiPersen + '%</b></td></tr>';
  }).join('');
  return '<div class="table-wrap"><table><thead><tr><th>#</th><th>Nama</th><th>Hari Kerja</th><th class="text-right">KPI %</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

var KPI_RANK_PERIODE_LOCAL = null;

function renderKPIRanking(content) {
  if (!KPI_RANK_PERIODE_LOCAL) KPI_RANK_PERIODE_LOCAL = STATE.periode;
  return loadKPIRankingTable(content, KPI_RANK_PERIODE_LOCAL);

function loadKPIRankingTable(content, periode) {
  return gsRun('getRankingKPIKehadiran', STATE.token, periode).then(function (list) {
    var opsi = STATE.periodeList.map(function (p) {
      return '<option value="' + esc(p.Periode) + '"' + (p.Periode === periode ? ' selected' : '') + '>' + esc(periodeLabel(p.Periode)) + '</option>';
    }).join('');
    var validList = list.filter(function (d) { return d.hariKerjaWajib > 0; });
    var kpi100 = validList.filter(function (d) { return d.kpiPersen >= 100; }).length;

    content.innerHTML =
      '<div class="toolbar">' +
        '<label style="font-size:12px;font-weight:600;color:var(--muted);">Filter Periode:</label>' +
        '<select id="kpiRankPeriode" class="periode-select">' + opsi + '</select>' +
        '<div class="spacer"></div>' +
        '<span style="font-size:12px;color:var(--muted);">' + list.length + ' karyawan aktif &middot; ' + kpi100 + ' hadir sempurna (100%)</span>' +
        '<button class="btn btn-ghost" id="btnExportKPIXlsx" type="button">⬇️ Excel</button>' +
        '<button class="btn btn-ghost" id="btnExportKPIPdf" type="button">📄 PDF</button>' +
        '<button class="btn btn-ghost" id="btnExportKPIJpg" type="button">🖼️ JPG</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">🏅 Ranking &amp; Laporan KPI Kehadiran — ' + esc(periodeLabel(periode)) + '</div>' +
        buildKPIRankingTable(list) +
      '</div>';

    var sel = document.getElementById('kpiRankPeriode');
    if (sel) sel.addEventListener('change', function () {
      KPI_RANK_PERIODE_LOCAL = this.value;
      showLoading(true);
      loadKPIRankingTable(content, KPI_RANK_PERIODE_LOCAL).finally(function () { showLoading(false); });
    });
    document.getElementById('btnExportKPIXlsx').addEventListener('click', function () { eksporKPIRankingXlsx_(list, periode); });
    document.getElementById('btnExportKPIPdf').addEventListener('click', function () { eksporKPIRankingTabel_('pdf', periode); });
    document.getElementById('btnExportKPIJpg').addEventListener('click', function () { eksporKPIRankingTabel_('jpg', periode); });

function eksporKPIRankingXlsx_(list, periode) {
  var data = list.map(function (d) {
    return {
      Ranking: d.ranking, Nama: d.Nama, Jabatan: d.Jabatan, 'Hari Kerja Wajib': d.hariKerjaWajib,
      P: d.P, O: d.O, S: d.S, I: d.I, A: d.A, C: d.C, T: d.T, N: d.N,
      'Total Poin': d.totalPoin, 'Total Penalti': d.totalPenalti, 'Skor KPI': d.skorKPI, 'KPI %': d.kpiPersen
    };
  });
  exportArrayToXlsx_(data, 'Ranking_KPI_Kehadiran_' + periode);
}

function eksporKPIRankingTabel_(tipe, periode) {
  var tableEl = document.querySelector('#content .table-wrap table');
  jalankanEksporTabel_(tipe, 'Ranking KPI Kehadiran — Wonderland Park Samarinda', 'Periode: ' + periodeLabel(periode), tableEl, null, 'Ranking_KPI_Kehadiran_' + periode);
}

function buildKPIRankingTable(list) {
  if (!list || list.length === 0) return '<div class="empty-state"><div class="icon">📭</div>Belum ada data karyawan aktif untuk periode ini.</div>';
  var validList = list.filter(function (d) { return d.hariKerjaWajib > 0; });
  var minKPI = validList.length ? Math.min.apply(null, validList.map(function (d) { return d.kpiPersen; })) : null;

  var rows = list.map(function (d) {
    var rowStyle = '';
    var rankCell = String(d.ranking);
    if (d.hariKerjaWajib > 0 && d.ranking === 1) {
      rankCell = '🥇 ' + d.ranking;
      rowStyle = 'background:#fffbeb;';
    } else if (d.hariKerjaWajib > 0 && minKPI !== null && d.kpiPersen === minKPI && validList.length > 1) {
      rowStyle = 'background:#fef2f2;';
    }
    var kpiBadgeClass = d.kpiPersen >= 100 ? 'badge-green' : (d.kpiPersen >= 80 ? 'badge-blue' : (d.kpiPersen >= 60 ? 'badge-amber' : 'badge-red'));
    return '<tr style="' + rowStyle + '">' +
      '<td><b>' + rankCell + '</b></td>' +
      '<td>' + esc(d.Nama) + (d.hariKerjaWajib > 0 && d.kpiPersen >= 100 ? ' <span class="badge badge-green" style="margin-left:4px;">Hadir Sempurna</span>' : '') + '</td>' +
      '<td>' + esc(d.Jabatan) + '</td>' +
      '<td class="text-center">' + d.hariKerjaWajib + '</td>' +
      '<td class="text-center">' + d.P + '</td>' +
      '<td class="text-center">' + d.O + '</td>' +
      '<td class="text-center">' + d.S + '</td>' +
      '<td class="text-center">' + d.I + '</td>' +
      '<td class="text-center">' + d.A + '</td>' +
      '<td class="text-center">' + d.C + '</td>' +
      '<td class="text-center">' + d.T + '</td>' +
      '<td class="text-center">' + d.N + '</td>' +
      '<td class="text-center">' + d.totalPoin + '</td>' +
      '<td class="text-center">' + d.totalPenalti + '</td>' +
      '<td class="text-center"><b>' + d.skorKPI + '</b></td>' +
      '<td class="text-right"><span class="badge ' + kpiBadgeClass + '">' + d.kpiPersen + '%</span></td>' +
      '</tr>';
  }).join('');

  return '<p style="font-size:12px;color:var(--muted);margin-top:-6px;">Diurutkan otomatis dari KPI% tertinggi ke terendah. Jika KPI% sama, urutan ditentukan: Total Penalti terkecil &rarr; jumlah Hadir (P) terbanyak &rarr; jumlah pelanggaran (S+I+A+C+T+N) tersedikit &rarr; nama A-Z. ' +
    '🥇 = Ranking #1 (KPI tertinggi). Baris kuning = ranking #1. Baris merah = KPI% terendah pada periode ini. Rumus &amp; pengaturan mengikuti menu <b>Pengaturan &rarr; KPI Kehadiran</b>.</p>' +
    '<div class="table-wrap"><table><thead><tr>' +
    '<th>#</th><th>Nama Karyawan</th><th>Jabatan</th><th class="text-center">Hari Kerja Wajib</th>' +
    '<th class="text-center">P</th><th class="text-center">O</th><th class="text-center">S</th><th class="text-center">I</th>' +
    '<th class="text-center">A</th><th class="text-center">C</th><th class="text-center">T</th><th class="text-center">N</th>' +
    '<th class="text-center">Total Poin</th><th class="text-center">Total Penalti</th><th class="text-center">Skor KPI</th><th class="text-right">KPI %</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

// Mengubah tanggal apapun formatnya (ISO atau teks Indonesia lama) menjadi "yyyy-MM-dd"
// supaya bisa ditampilkan dengan benar di <input type="date">. Kalau tidak terbaca sama
// sekali, kembalikan string kosong (bukan teks aslinya) supaya <input type="date"> tidak
// mengosongkan diri secara diam-diam saat form disimpan.
function toISODateForInput_(s) {
  var d = parseTanggalFleksibel_(s);
  if (!d) return '';
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* ============================================================================
   EXPORT TAMPILAN GRID KE PDF / JPG (dipakai Absensi Harian & Rekap Lembur)
   Menangkap tabel APA ADANYA seperti tampil di web app (termasuk klik-belum-
   disimpan), lalu dirender jadi gambar via html2canvas. Legenda kode absensi
   (opsional) ditambahkan otomatis di bawah tabel untuk halaman Absensi Harian.
   ============================================================================ */
function formatWaktuEkspor_() {
  try { return new Date().toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' }); }
  catch (e) { return new Date().toString(); }
}

// Klon <table> dari DOM asli, lalu bersihkan hal-hal yang tidak cocok untuk gambar statis:
// sticky column dimatikan (biar tidak overlap/terpotong), semua input/select diganti jadi teks
// polos sesuai nilai yang sedang ditampilkan (termasuk perubahan yang belum disimpan), tombol dihapus.
function cloneTableUntukEkspor_(tableEl) {
  var clone = tableEl.cloneNode(true);
  clone.querySelectorAll('.sticky-col').forEach(function (c) {
    c.style.position = 'static';
    c.style.boxShadow = 'none';
  });
  clone.querySelectorAll('input').forEach(function (inp) {
    var span = document.createElement('span');
    var val = inp.value;
    span.textContent = (val === '' || val === null || val === undefined) ? '-' : val;
    span.style.cssText = 'display:inline-block;min-width:24px;font-weight:600;';
    if (inp.parentNode) inp.parentNode.replaceChild(span, inp);
  });
  clone.querySelectorAll('.lembur-note-dot, .komp-auto-caption').forEach(function (el) { el.remove(); });
  clone.querySelectorAll('select').forEach(function (sel) {
    var span = document.createElement('span');
    span.textContent = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : '';
    if (sel.parentNode) sel.parentNode.replaceChild(span, sel);
  });
  clone.querySelectorAll('button').forEach(function (b) { b.remove(); });
  return clone;
}

// Bangun kontainer tersembunyi (di luar layar) berisi judul + tabel bersih + legenda opsional,
// siap ditangkap html2canvas.
function buildKontainerEkspor_(judul, subjudul, tableClone, legendHtml) {
  var el = document.createElement('div');
  el.id = 'exportCaptureArea';
  el.style.cssText = 'position:fixed;left:-99999px;top:0;background:#ffffff;padding:20px;font-family:Arial,Helvetica,sans-serif;color:#0f172a;width:max-content;';
  var head = document.createElement('div');
  head.style.marginBottom = '12px';
  head.innerHTML =
    '<div style="font-size:17px;font-weight:700;">' + esc(judul) + '</div>' +
    (subjudul ? '<div style="font-size:12px;color:#64748b;margin-top:2px;">' + esc(subjudul) + '</div>' : '');
  el.appendChild(head);
  el.appendChild(tableClone);
  if (legendHtml) {
    var legendDiv = document.createElement('div');
    legendDiv.style.cssText = 'margin-top:14px;font-size:11px;line-height:2;';
    legendDiv.innerHTML = '<b>Keterangan Kode Absensi:</b><br>' + legendHtml;
    el.appendChild(legendDiv);
  }
  var footer = document.createElement('div');
  footer.style.cssText = 'margin-top:12px;font-size:9px;color:#94a3b8;';
  footer.textContent = 'Diekspor dari Sistem Gaji — Wonderland Park Samarinda pada ' + formatWaktuEkspor_();
  el.appendChild(footer);
  document.body.appendChild(el);
  el.querySelectorAll('table').forEach(function (t) { t.style.borderCollapse = 'collapse'; t.style.fontSize = '11px'; });
  el.querySelectorAll('th,td').forEach(function (c) { c.style.border = '1px solid #cbd5e1'; c.style.padding = '4px 7px'; c.style.whiteSpace = 'nowrap'; });
  el.querySelectorAll('th').forEach(function (c) { c.style.background = '#f1f5f9'; });
  return el;
}

function tangkapKontainerJadiCanvas_(el) {
  return html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
}

function unduhCanvasJpg_(canvas, filename) {
  var link = document.createElement('a');
  link.download = filename + '.jpg';
  link.href = canvas.toDataURL('image/jpeg', 0.92);
  link.click();
}

// PDF; orientasi 'landscape' (default, dipakai tabel lebar) atau 'portrait' (dipakai dashboard).
// Gambar diskalakan penuh lebar halaman; otomatis dipecah jadi beberapa halaman kalau lebih tinggi dari satu halaman.
function unduhCanvasPdf_(canvas, filename, orientation) {
  var doc = new jspdf.jsPDF({ orientation: orientation || 'landscape', unit: 'pt', format: 'a4' });
  var margin = 24;
  var pageW = doc.internal.pageSize.getWidth();
  var pageH = doc.internal.pageSize.getHeight();
  var maxW = pageW - margin * 2;
  var maxHPerPage = pageH - margin * 2;
  var imgW = maxW;
  var imgH = imgW * (canvas.height / canvas.width);

  if (imgH <= maxHPerPage) {
    doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', margin, margin, imgW, imgH);
  } else {
    var pxPerPage = Math.floor(maxHPerPage * (canvas.width / imgW));
    var totalPages = Math.ceil(canvas.height / pxPerPage);
    for (var p = 0; p < totalPages; p++) {
      var sy = p * pxPerPage;
      var sh = Math.min(pxPerPage, canvas.height - sy);
      var pageCanvas = document.createElement('canvas');
      pageCanvas.width = canvas.width;
      pageCanvas.height = sh;
      var ctx = pageCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
      ctx.drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);
      var sliceH = imgW * (sh / canvas.width);
      if (p > 0) doc.addPage();
      doc.addImage(pageCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', margin, margin, imgW, sliceH);
    }
  }
  doc.save(filename + '.pdf');
}

// tipe: 'jpg' atau 'pdf'
function jalankanEksporTabel_(tipe, judul, subjudul, tableEl, legendHtml, filename) {
  if (!tableEl) { toast('Tabel tidak ditemukan untuk diekspor.', 'error'); return; }
  toast(tipe === 'pdf' ? 'Menyiapkan PDF...' : 'Menyiapkan gambar JPG...', 'info');
  var tableClone = cloneTableUntukEkspor_(tableEl);
  var el = buildKontainerEkspor_(judul, subjudul, tableClone, legendHtml);
  tangkapKontainerJadiCanvas_(el).then(function (canvas) {
    document.body.removeChild(el);
    if (tipe === 'pdf') { unduhCanvasPdf_(canvas, filename); } else { unduhCanvasJpg_(canvas, filename); }
    toast((tipe === 'pdf' ? 'PDF' : 'Gambar JPG') + ' berhasil diunduh', 'success');
  }).catch(function (err) {
    if (el.parentNode) document.body.removeChild(el);
    toast('Gagal membuat ' + (tipe === 'pdf' ? 'PDF' : 'JPG') + ': ' + (err.message || err), 'error');
  });
}

// Menangkap satu elemen DOM langsung (mis. kartu slip gaji) apa adanya di layar, tanpa dibungkus
// ulang — dipakai untuk elemen yang bukan <table> dan sudah tampil rapi di halaman.
function eksporElemenSebagaiJpg_(el, filename) {
  if (!el) { toast('Elemen tidak ditemukan untuk diekspor.', 'error'); return; }
  toast('Menyiapkan gambar JPG...', 'info');
  html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(function (canvas) {
    unduhCanvasJpg_(canvas, filename);
    toast('Gambar JPG berhasil diunduh', 'success');
  }).catch(function (err) {
    toast('Gagal membuat JPG: ' + (err.message || err), 'error');
  });
}

// Sama seperti di atas tapi hasil akhirnya PDF (dipakai untuk Dashboard, dsb).
function eksporElemenSebagaiPdf_(el, filename, orientation) {
  if (!el) { toast('Elemen tidak ditemukan untuk diekspor.', 'error'); return; }
  toast('Menyiapkan PDF...', 'info');
  html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(function (canvas) {
    unduhCanvasPdf_(canvas, filename, orientation || 'portrait');
    toast('PDF berhasil diunduh', 'success');
  }).catch(function (err) {
    toast('Gagal membuat PDF: ' + (err.message || err), 'error');
  });
}

// Export Excel PROFESIONAL untuk grid Absensi Harian: 1 baris per karyawan, 1 kolom per
// tanggal, warna latar & warna teks tiap sel PERSIS mengikuti "Warna" di Master Kode Absensi
// (sama seperti tampilan di web). Kolom rekap P/O/I/S/A/C/T/N di ujung kanan, plus sheet
// kedua berisi keterangan/legenda kode.
// Membangun sheet "Absensi Harian" + sheet "Keterangan Kode" langsung ke dalam workbook (wb)
// yang diberikan. Dipakai baik untuk export mandiri maupun untuk Laporan Gaji Karyawan (gabungan).
// opts: { absensi: array data absensi periode berjalan, perusahaan: nama perusahaan }
function buildAbsensiHarianSheet_(wb, opts) {
  var style = getExportStyleFromState_();
  var absensi = opts.absensi;
  var range = getPeriodeRange(STATE.periode);
  var dates = dateRangeArray(range.mulai, range.selesai);
  var karyawanAktif = STATE.karyawan.filter(function (k) { return k.Status === 'Aktif'; });
  var absMap = {};
  absensi.forEach(function (a) { absMap[a.ID_Karyawan + '|' + a.Tanggal] = a; });
  var REKAP_KODE_URUT = ['P', 'O', 'I', 'S', 'A', 'C', 'T', 'N'];
  var bln = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

  var totalCols = 1 + dates.length + REKAP_KODE_URUT.length;
  var ws = wb.addWorksheet('Absensi Harian');
  addTitleRows_(ws, totalCols, opts.perusahaan || 'WONDERLAND PARK SAMARINDA', 'ABSENSI HARIAN', 'Periode: ' + periodeRangeLabel(STATE.periode) + ' (' + STATE.periode + ')');

  var headerRowIdx = 5;
  var headerRow = ws.getRow(headerRowIdx);
  headerRow.getCell(1).value = 'Karyawan';
  dates.forEach(function (tgl, i) {
    var d = new Date(tgl + 'T00:00:00');
    headerRow.getCell(2 + i).value = d.getDate() + ' ' + bln[d.getMonth()];
  });
  REKAP_KODE_URUT.forEach(function (kd, i) { headerRow.getCell(2 + dates.length + i).value = kd; });
  styleHeaderRow_(headerRow, totalCols);
  ws.views = [{ state: 'frozen', xSplit: 1, ySplit: headerRowIdx }];

  karyawanAktif.forEach(function (k, rIdx) {
    var row = ws.getRow(headerRowIdx + 1 + rIdx);
    var namaCell = row.getCell(1);
    namaCell.value = k.Nama + (k.Jabatan ? ' (' + k.Jabatan + ')' : '');
    namaCell.alignment = { horizontal: 'left', vertical: 'middle' };
    namaCell.font = { bold: true, size: 10 };
    namaCell.border = THIN_BORDER_;

    var rekapCount = {};
    REKAP_KODE_URUT.forEach(function (kd) { rekapCount[kd] = 0; });

    dates.forEach(function (tgl, i) {
      var a = absMap[k.ID_Karyawan + '|' + tgl];
      var kode = a ? a.Kode : '';
      if (kode && rekapCount.hasOwnProperty(kode)) rekapCount[kode]++;
      var cell = row.getCell(2 + i);
      cell.value = kode || '';
      cell.alignment = { horizontal: 'center', vertical: 'middle' };
      cell.border = THIN_BORDER_;
      var kodeInfo = STATE.kodeAbsensi.find(function (x) { return x.Kode === kode; });
      if (kodeInfo && kode) {
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: tintHex_(kodeInfo.Warna, 34 / 255) } };
        cell.font = { bold: true, size: 10, color: { argb: hexToArgb_(kodeInfo.Warna) } };
      }
      if (a && (a.Keterangan || Number(a.Jam_Lembur) > 0)) {
        cell.note = 'Jam Lembur: ' + (Number(a.Jam_Lembur) || 0) + (a.Keterangan ? '\n' + a.Keterangan : '');
      }
    });

    REKAP_KODE_URUT.forEach(function (kd, i) {
      var cell = row.getCell(2 + dates.length + i);
      cell.value = rekapCount[kd] || 0;
      cell.alignment = { horizontal: 'center', vertical: 'middle' };
      cell.font = { bold: true, size: 10, color: { argb: 'FF334155' } };
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: style.zebra } };
      cell.border = THIN_BORDER_;
    });

    if (style.zebraAktif && rIdx % 2 === 1) {
      if (!namaCell.fill) namaCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: style.zebra } };
    }
  });

  ws.getColumn(1).width = 28;
  for (var c = 2; c <= 1 + dates.length; c++) ws.getColumn(c).width = 5.5;
  for (var c2 = 2 + dates.length; c2 <= totalCols; c2++) ws.getColumn(c2).width = 5;

  // Sheet kedua: legenda / keterangan kode absensi (kode, nama, kategori, contoh warna)
  var wsLegend = wb.addWorksheet('Keterangan Kode');

function parseAbsensiSheet_(rows) {
  var headerRow = rows[0] || [];
  var range = getPeriodeRange(STATE.periode);
  var periodeDates = dateRangeArray(range.mulai, range.selesai);
  var dateCols = [];
  var validCodes = STATE.kodeAbsensi.map(function (k) { return k.Kode; });
  for (var c = 3; c < headerRow.length; c++) {
    var h = headerRow[c];
    if (h === '' || h === null || h === undefined) continue;
    var full = parseFullDateHeader_(h);
    if (full) { dateCols.push({ col: c, tgl: full }); continue; }
    var dayNum = parseInt(h, 10);
    if (!isNaN(dayNum) && dayNum >= 1 && dayNum <= 31) {
      var guessed = guessTanggalFromDay_(dayNum, periodeDates, range);
      if (guessed) dateCols.push({ col: c, tgl: guessed });
      continue;
    }
    break;
  }
  var entries = [];
  var namesFound = {};
  for (var r = 1; r < rows.length; r++) {
    var row = rows[r];
    if (!row || !row[1]) continue;
    var nama = String(row[1]).trim();
    var karyawan = STATE.karyawan.find(function (k) { return k.Nama.trim().toLowerCase() === nama.toLowerCase(); });
    if (!karyawan) continue;
    namesFound[nama] = true;
    dateCols.forEach(function (dc) {
      var kode = row[dc.col];
      if (!kode) return;
      kode = String(kode).trim().toUpperCase();
      if (validCodes.indexOf(kode) === -1) return;
      entries.push({ ID_Karyawan: karyawan.ID_Karyawan, Tanggal: dc.tgl, Kode: kode, Jam_Lembur: 0 });
    });
  }
  return { entries: entries, karyawanCount: Object.keys(namesFound).length };
}

function parseFullDateHeader_(h) {
  if (h instanceof Date) return h.getFullYear() + '-' + pad2(h.getMonth() + 1) + '-' + pad2(h.getDate());
  var s = String(h).trim();
  var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + '-' + pad2(parseInt(m[2], 10)) + '-' + pad2(parseInt(m[3], 10));
  return null;
}

function guessTanggalFromDay_(day, periodeDates, range) {
  var endMonth = range.selesai.substring(0, 7);
  var startMonth = range.mulai.substring(0, 7);
  var candidateEnd = periodeDates.find(function (d) { return d.substring(0, 7) === endMonth && parseInt(d.substring(8, 10), 10) === day; });
  if (candidateEnd) return candidateEnd;
  var candidateStart = periodeDates.find(function (d) { return d.substring(0, 7) === startMonth && parseInt(d.substring(8, 10), 10) === day; });
  if (candidateStart) return candidateStart;
  return null;
}

  var k = STATE.karyawan.find(function (x) { return x.ID_Karyawan === idKaryawan; });
  var rowsK = REKAP_ABSENSI_CACHE_.rows.filter(function (r) { return r.ID_Karyawan === idKaryawan; })
    .sort(function (a, b) { return a.Tanggal < b.Tanggal ? -1 : 1; });
  var shiftMap = {};
  REKAP_ABSENSI_CACHE_.shiftList.forEach(function (s) { shiftMap[s.Kode_Shift] = s; });

  var body = '<div class="table-wrap" style="max-height:60vh;overflow:auto;">' +
    '<table><thead><tr><th>Tanggal</th><th>Shift</th><th>Jadwal</th><th>Masuk</th><th>Pulang</th><th class="text-center">Jam Kerja</th><th class="text-center">Telat</th><th class="text-center">Overtime</th><th class="text-center">Dihitung Lembur?</th></tr></thead><tbody>' +
    rowsK.map(function (r) {
      var sft = shiftMap[r.Kode_Shift];
      return '<tr' + (r.Status_Anomali === 'Y' ? ' style="background:#fef2f2;"' : '') + '>' +
        '<td>' + esc(fmtTanggal(r.Tanggal)) + '</td>' +
        '<td>' + (sft ? esc(sft.Nama_Shift) : (r.Kode_Shift || '-')) + '</td>' +
        '<td style="color:var(--muted);font-size:12px;">' + esc(r.Jam_Masuk_Jadwal || '-') + ' – ' + esc(r.Jam_Pulang_Jadwal || '-') + '</td>' +
        '<td class="text-center">' + esc(r.Jam_Masuk_Aktual || '-') + '</td>' +
        '<td class="text-center">' + esc(r.Jam_Pulang_Aktual || '-') + '</td>' +
        '<td class="text-center">' + (r.Total_Jam_Kerja || 0) + ' jam' + (r.Status_Anomali === 'Y' ? ' <span class="badge badge-amber" title="Jam kerja tidak wajar, kemungkinan tap-in/tap-out ganda di Majoo">⚠️ Perlu Dicek</span>' : '') + '</td>' +
        '<td class="text-center">' + (Number(r.Menit_Telat) > 0 ? '<span class="badge badge-red">' + r.Menit_Telat + ' mnt</span>' : '-') + '</td>' +
        '<td class="text-center">' + (Number(r.Jam_Overtime) > 0 ? r.Jam_Overtime + ' jam' : '-') + '</td>' +
        '<td class="text-center">' + (Number(r.Jam_Overtime) > 0 ?
          '<select class="detail-lembur-toggle" data-id="' + r.ID + '" onchange="ubahToggleOvertime(this)">' +
            '<option value="N"' + (r.Overtime_Dihitung_Lembur !== 'Y' ? ' selected' : '') + '>Tidak</option>' +
            '<option value="Y"' + (r.Overtime_Dihitung_Lembur === 'Y' ? ' selected' : '') + '>Ya</option>' +
          '</select>' : '-') +
        '</td>' +
      '</tr>';
    }).join('') +
    '</tbody></table></div>';

  openModal('Detail Absensi — ' + (k ? k.Nama : idKaryawan), body, '<button class="btn btn-ghost" type="button" onclick="closeModal()">Tutup</button>');
}

function ubahToggleOvertime(sel) {
  var id = sel.getAttribute('data-id');
  var value = sel.value;
  sel.disabled = true;
  gsRun('toggleOvertimeLembur', STATE.token, id, value).then(function () {
    sel.disabled = false;
    var row = REKAP_ABSENSI_CACHE_.rows.find(function (r) { return r.ID === id; });
    if (row) row.Overtime_Dihitung_Lembur = value;
    toast('Status lembur diperbarui', 'success');
  }).catch(function (err) {
    sel.disabled = false;
    toast('Gagal: ' + (err.message || err), 'error');
  });
}

function shiftRowHtml_(s, idx) {
  return '<tr class="shiftRow" data-idx="' + idx + '">' +
    '<td><input class="shift-kode" style="width:80px;text-transform:uppercase;font-weight:700;" value="' + esc(s.Kode_Shift || '') + '"></td>' +
    '<td><input class="shift-nama" style="min-width:200px;" value="' + esc(s.Nama_Shift || '') + '"></td>' +
    '<td><input class="shift-masuk" type="time" value="' + esc(s.Jam_Masuk || '08:00') + '"></td>' +
    '<td><input class="shift-pulang" type="time" value="' + esc(s.Jam_Pulang || '16:00') + '"></td>' +
    '<td><select class="shift-lintas"><option value="N"' + (s.Lintas_Hari !== 'Y' ? ' selected' : '') + '>Tidak</option><option value="Y"' + (s.Lintas_Hari === 'Y' ? ' selected' : '') + '>Ya</option></select></td>' +
    '<td><input class="shift-toleransi" type="number" min="0" step="1" style="width:70px;" value="' + esc(s.Toleransi_Telat_Menit === undefined ? 0 : s.Toleransi_Telat_Menit) + '"></td>' +
    '<td><select class="shift-lembur-otomatis"><option value="N"' + (s.Hitung_Lembur_Otomatis !== 'Y' ? ' selected' : '') + '>Tidak</option><option value="Y"' + (s.Hitung_Lembur_Otomatis === 'Y' ? ' selected' : '') + '>Ya</option></select></td>' +
    '<td><button class="btn btn-danger btn-sm" type="button" onclick="this.closest(\'tr\').remove()">Hapus</button></td>' +
  '</tr>';
}

function openShiftSettingsModal() {
  var shiftList = REKAP_ABSENSI_CACHE_.shiftList || [];
  var body =
    '<p style="font-size:12px;color:var(--muted);">Shift dipakai untuk mendeteksi jadwal karyawan secara otomatis berdasarkan jam masuk aktual paling dekat, menghitung keterlambatan, dan menentukan apakah kelebihan jam kerja (>8 jam) pada shift tersebut otomatis ditandai sebagai lembur berbayar.</p>' +
    '<div class="table-wrap"><table><thead><tr><th>Kode</th><th>Nama Shift</th><th>Jam Masuk</th><th>Jam Pulang</th><th>Lintas Hari?</th><th>Toleransi Telat (mnt)</th><th>Overtime Otomatis Lembur?</th><th></th></tr></thead>' +
    '<tbody id="shiftTbody">' + shiftList.map(function (s, i) { return shiftRowHtml_(s, i); }).join('') + '</tbody></table></div>' +
    '<button class="btn btn-ghost btn-sm" id="btnTambahShift" type="button" style="margin-top:10px;">+ Tambah Shift</button>';
  var footer =
    '<button class="btn btn-ghost" type="button" onclick="closeModal()">Batal</button>' +
    '<button class="btn btn-primary" id="btnSimpanShift" type="button">💾 Simpan Shift</button>';
  openModal('⚙️ Atur Shift Kerja', body, footer);

  document.getElementById('btnTambahShift').addEventListener('click', function () {
    var tbody = document.getElementById('shiftTbody');
    var idx = tbody.querySelectorAll('tr').length;
    tbody.insertAdjacentHTML('beforeend', shiftRowHtml_({ Kode_Shift: '', Nama_Shift: '', Jam_Masuk: '08:00', Jam_Pulang: '16:00', Lintas_Hari: 'N', Toleransi_Telat_Menit: 0, Hitung_Lembur_Otomatis: 'N' }, idx));
  });

  document.getElementById('btnSimpanShift').addEventListener('click', function () {
    var rowsEl = Array.prototype.slice.call(document.querySelectorAll('#shiftTbody tr'));
    var items = [];
    rowsEl.forEach(function (tr) {
      var kode = tr.querySelector('.shift-kode').value.trim().toUpperCase();
      if (!kode) return;
      items.push({
        Kode_Shift: kode,
        Nama_Shift: tr.querySelector('.shift-nama').value.trim(),
        Jam_Masuk: tr.querySelector('.shift-masuk').value || '00:00',
        Jam_Pulang: tr.querySelector('.shift-pulang').value || '00:00',
        Lintas_Hari: tr.querySelector('.shift-lintas').value,
        Toleransi_Telat_Menit: tr.querySelector('.shift-toleransi').value,
        Hitung_Lembur_Otomatis: tr.querySelector('.shift-lembur-otomatis').value
      });
    });
    if (items.length === 0) { toast('Minimal harus ada 1 shift dengan Kode terisi', 'error'); return; }
    var btn = this; btn.disabled = true; btn.textContent = 'Menyimpan...';
    gsRun('saveShiftBulk', STATE.token, items).then(function (res) {
      toast(res.message, 'success');
      closeModal();
      navigate('rekapabsensi');
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = '💾 Simpan Shift';
      toast('Gagal: ' + (err.message || err), 'error');
    });
  });
}

var lemburGridDirty = {};
function renderLembur(content) {
  var readOnly = STATE.user.role === 'Karyawan';
  return gsRun('getAbsensiPeriode', STATE.token, STATE.periode).then(function (absensi) {
    lemburGridDirty = {};
    var range = getPeriodeRange(STATE.periode);
    var dates = dateRangeArray(range.mulai, range.selesai);
    var karyawanAktif = STATE.karyawan.filter(function (k) { return k.Status === 'Aktif'; });
    var absMap = {};
    absensi.forEach(function (a) { absMap[a.ID_Karyawan + '|' + a.Tanggal] = a; });

    var headerCells = dates.map(function (tgl) {
      var parts = tgl.split('-');
      var bln = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      return '<th class="text-center">' + parseInt(parts[2], 10) + '<br><span style="font-weight:400;color:var(--muted);font-size:10px;">' + bln[parseInt(parts[1], 10)] + '</span></th>';
    }).join('');

    var totalPerKaryawan = {};
    var rows = karyawanAktif.map(function (k) {
      var totalJam = 0;
      var cells = dates.map(function (tgl) {
        var a = absMap[k.ID_Karyawan + '|' + tgl];
        var jam = a ? (Number(a.Jam_Lembur) || 0) : 0;
        var catatan = a ? (a.Keterangan || '') : '';
        totalJam += jam;
        if (readOnly) {
          return '<td class="text-center">' + (jam || '') + '</td>';
        }
        return '<td class="text-center"><div class="lembur-cell-wrap">' +
          '<input type="number" min="0" step="0.5" class="lembur-input" ' +
          'data-idk="' + k.ID_Karyawan + '" data-tgl="' + tgl + '" data-catatan="' + esc(catatan) + '" value="' + (jam || '') + '" ' +
          'style="width:52px;padding:4px;border:1px solid var(--border);border-radius:6px;text-align:center;" ' +
          'onchange="markDirtyLembur(this)">' +
          '<span class="lembur-note-dot" style="display:' + (catatan ? 'block' : 'none') + '" title="Ada catatan lembur — klik untuk lihat/ubah" onclick="lemburCellEditor(this.previousElementSibling)"></span>' +
        '</div></td>';
      }).join('');
      totalPerKaryawan[k.ID_Karyawan] = totalJam;
      return '<tr><td class="sticky-col"><b>' + esc(k.Nama) + '</b><br><span style="color:var(--muted);font-size:11px;">' + esc(k.Jabatan) + '</span></td>' + cells +
        '<td class="sticky-col text-center" style="right:0;left:auto;"><b id="totalLembur_' + k.ID_Karyawan + '">' + totalJam + '</b></td></tr>';
    }).join('');

    content.innerHTML =
      (readOnly ?
        '<div class="alert alert-info">Periode: <b>' + esc(periodeRangeLabel(STATE.periode)) + '</b>. Anda dapat melihat rekap jam lembur seluruh karyawan, namun tidak dapat mengubah, mengisi, atau menghapus data ini.</div>'
      :
        '<div class="alert alert-info">Periode: <b>' + esc(periodeRangeLabel(STATE.periode)) + '</b>. Isi jumlah jam lembur per tanggal untuk tiap karyawan, lalu klik <b>Simpan Semua</b>. Kode absensi (P/O/I/dst) pada tanggal tersebut tidak akan berubah. Klik kanan / tekan lama sel (atau titik oranye) untuk menambahkan <b>catatan alasan/tujuan lembur</b> — catatan bersifat tersembunyi dan hanya terlihat saat kolomnya diklik.</div>'
      ) +
      '<div class="toolbar"><div class="spacer"></div>' +
        '<button class="btn btn-ghost" id="btnExportLembur" type="button">⬇️ Export Excel</button>' +
        '<button class="btn btn-ghost" id="btnExportLemburJpg" type="button">🖼️ Export JPG</button>' +
        '<button class="btn btn-ghost" id="btnExportLemburPdf" type="button">📄 Export PDF</button>' +
        (readOnly ? '' : '<button class="btn btn-primary" id="btnSimpanLembur" type="button">💾 Simpan Semua</button>') +
      '</div>' +
      '<div class="table-wrap" style="max-height:70vh;overflow:auto;">' +
        '<table><thead><tr><th class="sticky-col" style="min-width:170px;">Karyawan</th>' + headerCells + '<th class="sticky-col" style="right:0;left:auto;min-width:70px;">Total Jam</th></tr></thead>' +
        '<tbody>' + (rows || '<tr><td colspan="' + (dates.length + 2) + '"><div class="empty-state">Tidak ada karyawan aktif</div></td></tr>') + '</tbody></table>' +
      '</div>';

    if (!readOnly) {
      document.getElementById('btnSimpanLembur').addEventListener('click', simpanLemburGrid);
    }
    document.getElementById('btnExportLembur').addEventListener('click', eksporRekapLemburXlsx_);
    document.getElementById('btnExportLemburJpg').addEventListener('click', function () { eksporRekapLembur_('jpg'); });
    document.getElementById('btnExportLemburPdf').addEventListener('click', function () { eksporRekapLembur_('pdf'); });

    if (!readOnly) {
      content.querySelectorAll('.lembur-input').forEach(function (inp) {
        addContextAction_(inp, function () { lemburCellEditor(inp); });
      });
    }
  });
}

// Export Excel PROFESIONAL untuk Rekap Lembur: grid lengkap 1 baris per karyawan, 1 kolom
// per tanggal (persis seperti tampilan web), jam lembur > 0 ditandai warna kuning/amber
// senada dengan badge lembur di web, plus kolom Total Jam & baris TOTAL keseluruhan.
// Membangun sheet "Rekap Lembur" (grid harian) langsung ke workbook (wb) yang diberikan.
// opts: { absensi: array data absensi periode berjalan, perusahaan: nama perusahaan }
function buildRekapLemburSheet_(wb, opts) {
  var style = getExportStyleFromState_();
  var absensi = opts.absensi;
  var range = getPeriodeRange(STATE.periode);
  var dates = dateRangeArray(range.mulai, range.selesai);
  var karyawanAktif = STATE.karyawan.filter(function (k) { return k.Status === 'Aktif'; });
  var absMap = {};
  absensi.forEach(function (a) { absMap[a.ID_Karyawan + '|' + a.Tanggal] = a; });
  var bln = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

  var totalCols = 1 + dates.length + 1;
  var ws = wb.addWorksheet('Rekap Lembur');
  addTitleRows_(ws, totalCols, opts.perusahaan || 'WONDERLAND PARK SAMARINDA', 'REKAP LEMBUR HARIAN', 'Periode: ' + periodeRangeLabel(STATE.periode) + ' (' + STATE.periode + ')');

  var headerRowIdx = 5;
  var headerRow = ws.getRow(headerRowIdx);
  headerRow.getCell(1).value = 'Karyawan';
  dates.forEach(function (tgl, i) {
    var d = new Date(tgl + 'T00:00:00');
    headerRow.getCell(2 + i).value = d.getDate() + ' ' + bln[d.getMonth()];
  });
  headerRow.getCell(2 + dates.length).value = 'Total Jam';
  styleHeaderRow_(headerRow, totalCols);
  ws.views = [{ state: 'frozen', xSplit: 1, ySplit: headerRowIdx }];

  var grandTotal = 0;
  karyawanAktif.forEach(function (k, rIdx) {
    var row = ws.getRow(headerRowIdx + 1 + rIdx);
    var namaCell = row.getCell(1);
    namaCell.value = k.Nama + (k.Jabatan ? ' (' + k.Jabatan + ')' : '');
    namaCell.alignment = { horizontal: 'left', vertical: 'middle' };
    namaCell.font = { bold: true, size: 10 };
    namaCell.border = THIN_BORDER_;
    if (style.zebraAktif && rIdx % 2 === 1) namaCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: style.zebra } };

    var total = 0;
    dates.forEach(function (tgl, i) {
      var a = absMap[k.ID_Karyawan + '|' + tgl];
      var jam = a ? (Number(a.Jam_Lembur) || 0) : 0;
      total += jam;
      var cell = row.getCell(2 + i);
      cell.value = jam || null;
      cell.numFmt = '0.0';
      cell.alignment = { horizontal: 'center', vertical: 'middle' };
      cell.border = THIN_BORDER_;
      if (jam > 0) {
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: style.totalBg } };
        cell.font = { bold: true, color: { argb: style.teksTotal } };
      }
      if (a && a.Keterangan) cell.note = a.Keterangan;
    });
    grandTotal += total;

    var totCell = row.getCell(2 + dates.length);
    totCell.value = total;
    totCell.numFmt = '0.0';
    totCell.font = { bold: true, size: 10, color: { argb: style.teksTotal } };
    totCell.alignment = { horizontal: 'center', vertical: 'middle' };
    totCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: style.zebra } };
    totCell.border = THIN_BORDER_;
  });

  var totalsRowIdx = headerRowIdx + 1 + karyawanAktif.length;
  var tRow = ws.getRow(totalsRowIdx);
  tRow.getCell(1).value = 'TOTAL';
  for (var c = 1; c <= totalCols; c++) {
    var cell = tRow.getCell(c);
    cell.font = { bold: true, size: 10, color: { argb: style.teksTotal } };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: style.totalBg } };
    cell.border = {
      top: { style: 'double', color: { argb: style.utama } },
      bottom: { style: 'thin', color: { argb: 'FFE2E8F0' } },
      left: { style: 'thin', color: { argb: 'FFE2E8F0' } },
      right: { style: 'thin', color: { argb: 'FFE2E8F0' } }
    };
  }
  tRow.getCell(2 + dates.length).value = grandTotal;
  tRow.getCell(2 + dates.length).numFmt = '0.0';
  tRow.getCell(2 + dates.length).alignment = { horizontal: 'center' };

  ws.getColumn(1).width = 28;
  for (var c2 = 2; c2 <= 1 + dates.length; c2++) ws.getColumn(c2).width = 5.5;
  ws.getColumn(2 + dates.length).width = 11;
}

// ===== EXPORT MASTER KARYAWAN (XLSX) =====
function dateToExcelUTC_(d) {
  return d ? new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())) : null;
}

function buildMasterKaryawanSheet_(wb, opts) {
  var style = getExportStyleFromState_();
  var list = opts.list || [];
  var ws = wb.addWorksheet('Master Karyawan', {
    pageSetup: { orientation: 'landscape', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: 0.4, right: 0.4, top: 0.6, bottom: 0.6, header: 0.3, footer: 0.3 } },
    headerFooter: { oddFooter: '&LDicetak dari Sistem Gaji&CHalaman &P dari &N&R&D' }
  });
  var cols = [
    { h: 'No', w: 5, al: 'center' },
    { h: 'ID', w: 11, al: 'center' },
    { h: 'Nama', w: 26, al: 'left' },
    { h: 'Jabatan', w: 22, al: 'left' },
    { h: 'Tanggal Masuk', w: 15, al: 'center' },
    { h: 'Lama Kerja', w: 12, al: 'center' },
    { h: 'Gaji Pokok', w: 16, al: 'right' },
    { h: 'Status', w: 11, al: 'center' },
    { h: 'Status Karyawan', w: 17, al: 'center' },
    { h: 'Jenis Kelamin', w: 14, al: 'center' },
    { h: 'Tanggal Lahir', w: 15, al: 'center' },
    { h: 'No. HP', w: 16, al: 'left' },
    { h: 'NIK', w: 21, al: 'left' },
    { h: 'Alamat', w: 40, al: 'left' },
    { h: 'Catatan', w: 30, al: 'left' }
  ];
  var n = cols.length;
  var aktif = list.filter(function (k) { return k.Status === 'Aktif'; }).length;
  var tgl = new Date();
  var tglStr = ('0' + tgl.getDate()).slice(-2) + '/' + ('0' + (tgl.getMonth() + 1)).slice(-2) + '/' + tgl.getFullYear();
  addTitleRows_(ws, n, opts.perusahaan || 'Wonderland Park Samarinda', 'DATA MASTER KARYAWAN',
    'Per ' + tglStr + '  •  Total ' + list.length + ' karyawan (' + aktif + ' aktif, ' + (list.length - aktif) + ' nonaktif)');

  var hr = 5, headerRow = ws.getRow(hr);
  cols.forEach(function (c, i) { headerRow.getCell(i + 1).value = c.h; ws.getColumn(i + 1).width = c.w; });
  styleHeaderRow_(headerRow, n);
  ws.autoFilter = { from: { row: hr, column: 1 }, to: { row: hr, column: n } };
  ws.views = [{ state: 'frozen', xSplit: 3, ySplit: hr, showGridLines: false }];
  ws.pageSetup.printTitlesRow = hr + ':' + hr;

  var first = hr + 1;
  list.forEach(function (k, idx) {
    var row = ws.getRow(first + idx);
    var masuk = dateToExcelUTC_(parseTanggalFleksibel_(k.Tanggal_Masuk));
    var lahir = dateToExcelUTC_(parseTanggalFleksibel_(k.Tanggal_Lahir));
    var vals = [
      idx + 1, k.ID_Karyawan || '', k.Nama || '', k.Jabatan || '', masuk || (k.Tanggal_Masuk || ''),
      hitungLamaBekerja(k.Tanggal_Masuk), Number(k.Gaji_Pokok) || 0, k.Status || '', k.Status_Kepegawaian || '',
      k.Jenis_Kelamin || '', lahir || (k.Tanggal_Lahir || ''), String(k.No_HP || ''), String(k.NIK || ''),
      k.Alamat || '', k.Catatan || ''
    ];
    vals.forEach(function (v, i) {
      var cell = row.getCell(i + 1);
      cell.value = (v === '' ? null : v);
      cell.border = THIN_BORDER_;
      cell.font = { size: 10, bold: i === 2 };
      cell.alignment = { horizontal: cols[i].al, vertical: 'middle', wrapText: i >= 13 };
      if (v instanceof Date) cell.numFmt = 'dd/mm/yyyy';
      if (i === 6) cell.numFmt = '"Rp" #,##0';
      if (i === 11 || i === 12) cell.numFmt = '@';          // teks: cegah nol depan hilang / format ilmiah
    });
    var st = row.getCell(8);
    if (k.Status === 'Aktif') st.font = { size: 10, bold: true, color: { argb: 'FF15803D' } };
    else st.font = { size: 10, bold: true, color: { argb: 'FF94A3B8' } };
    row.height = 20;
    if (style.zebraAktif && idx % 2 === 1) {
      row.eachCell({ includeEmpty: true }, function (cell) {
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: style.zebra } };
      });
    }
  });

  // Baris TOTAL: jumlah karyawan & total gaji pokok (rumus, ikut berubah jika data diedit)
  var last = first + list.length - 1, tr = ws.getRow(last + 1);
  for (var c = 1; c <= n; c++) {
    var cell = tr.getCell(c);
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: style.totalBg } };
    cell.font = { bold: true, size: 10, color: { argb: style.teksTotal } };
    cell.border = { top: { style: 'double', color: { argb: 'FF0F172A' } }, bottom: { style: 'thin', color: { argb: 'FF94A3B8' } }, left: THIN_BORDER_.left, right: THIN_BORDER_.right };
    cell.alignment = { vertical: 'middle', horizontal: 'center' };
  }
  ws.mergeCells(last + 1, 1, last + 1, 5);
  tr.getCell(1).value = 'TOTAL  (' + list.length + ' karyawan)';
  tr.getCell(1).alignment = { vertical: 'middle', horizontal: 'right' };
  if (list.length > 0) {
    var tot = list.reduce(function (a, k) { return a + (Number(k.Gaji_Pokok) || 0); }, 0);
    tr.getCell(7).value = { formula: 'SUM(G' + first + ':G' + last + ')', result: tot };
    tr.getCell(7).numFmt = '"Rp" #,##0';
    tr.getCell(7).alignment = { vertical: 'middle', horizontal: 'right' };
  }
  tr.height = 24;

  var note = ws.getRow(last + 3);
  ws.mergeCells(last + 3, 1, last + 3, n);
  note.getCell(1).value = 'Dokumen ini bersifat rahasia dan hanya untuk keperluan internal perusahaan.';
  note.getCell(1).font = { italic: true, size: 9, color: { argb: 'FF64748B' } };
  return ws;
}

function eksporKaryawanXlsx_(list) {
  if (!list || list.length === 0) { toast('Tidak ada data karyawan untuk diexport.', 'error'); return; }
  toast('Menyiapkan file Excel...', 'info');
  var b = getBrandingFromState_();
  var wb = new ExcelJS.Workbook();
  wb.creator = b.perusahaan || 'Sistem Gaji';
  wb.created = new Date();
  buildMasterKaryawanSheet_(wb, { list: list, perusahaan: b.perusahaan });
  var d = new Date();
  var stamp = d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
  return downloadWorkbook_(wb, 'Master_Karyawan_' + stamp).then(function () {
    toast('File Master_Karyawan_' + stamp + '.xlsx berhasil diunduh', 'success');
  });
}

function eksporRekapLemburXlsx_() {
  toast('Menyiapkan file Excel...', 'info');
  return gsRun('getAbsensiPeriode', STATE.token, STATE.periode).then(function (absensi) {
    var b = getBrandingFromState_();
    var wb = new ExcelJS.Workbook();
    wb.creator = b.perusahaan || 'Sistem Gaji';
    wb.created = new Date();
    buildRekapLemburSheet_(wb, { absensi: absensi, perusahaan: b.perusahaan });

  }).catch(function (err) {
    toast('Gagal export rekap lembur: ' + (err && err.message ? err.message : err), 'error');

}

function eksporRekapLembur_(tipe) {
  var tableEl = document.querySelector('#content .table-wrap table');
  jalankanEksporTabel_(tipe, 'Rekap Lembur — Wonderland Park Samarinda', 'Periode: ' + periodeRangeLabel(STATE.periode) + ' (' + STATE.periode + ')', tableEl, null, 'Rekap_Lembur_' + STATE.periode);
}

function lemburCellEditor(inp) {
  var idk = inp.getAttribute('data-idk');
  var tgl = inp.getAttribute('data-tgl');
  var kry = STATE.karyawan.find(function (k) { return k.ID_Karyawan === idk; });
  var nama = kry ? kry.Nama : idk;
  var jamNow = parseFloat(inp.value) || 0;
  var catatanNow = inp.getAttribute('data-catatan') || '';
  openLemburCatatanModal(nama, tgl, jamNow, catatanNow, function (jam, catatan) {
    inp.value = jam || '';
    inp.setAttribute('data-catatan', catatan);
    var dot = inp.parentElement.querySelector('.lembur-note-dot');
    if (dot) dot.style.display = catatan ? 'block' : 'none';
    markDirtyLembur(inp);
  });

function markDirtyLembur(input) {
  var idk = input.getAttribute('data-idk');
  var tgl = input.getAttribute('data-tgl');
  var jam = parseFloat(input.value) || 0;
  var catatan = input.getAttribute('data-catatan') || '';
  lemburGridDirty[idk + '|' + tgl] = { ID_Karyawan: idk, Tanggal: tgl, Jam_Lembur: jam, Keterangan: catatan };
  var totalEl = document.getElementById('totalLembur_' + idk);
  if (totalEl) {
    var rowInputs = document.querySelectorAll('.lembur-input[data-idk="' + idk + '"]');
    var sum = 0;
    rowInputs.forEach(function (inp) { sum += parseFloat(inp.value) || 0; });
    totalEl.textContent = sum;
  }
}

function simpanLemburGrid() {
  var entries = Object.values(lemburGridDirty);
  if (entries.length === 0) { toast('Tidak ada perubahan untuk disimpan', 'info'); return; }
  var btn = document.getElementById('btnSimpanLembur');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  gsRun('saveLemburBulk', STATE.token, entries).then(function (res) {
    toast(res.message, 'success');
    lemburGridDirty = {};
    return navigate('lembur');
  }).catch(function (err) {
    btn.disabled = false; btn.textContent = '💾 Simpan Semua';
    toast('Gagal: ' + (err.message || err), 'error');
  });
}

var CURRENT_KOMPONEN_MAP = {};
function renderKomponen(content) {
  return Promise.all([
    gsRun('getKomponenGaji', STATE.token, STATE.periode),
    gsRun('hitungGajiPeriode', STATE.token, STATE.periode)
  ]).then(function (results) {
    var komponen = results[0];
    var perhitungan = results[1];
    var map = {};
    komponen.forEach(function (k) { map[k.ID_Karyawan] = k; });
    CURRENT_KOMPONEN_MAP = map;
    var hitungMap = {};
    perhitungan.data.forEach(function (d) { hitungMap[d.ID_Karyawan] = d; });
    var aktif = STATE.karyawan.filter(function (k) { return k.Status === 'Aktif'; });
    var rateMakan = perhitungan.parameter.rateTunjanganMakan;
    var rateTelat = perhitungan.parameter.rateTelat;
    var HDEF = { Jumlah_Hadir: 0, Jumlah_Hadir_Otomatis: 0, Jumlah_Hadir_Penuh: 0, Jumlah_Setengah_Hari: 0, Jumlah_Telat: 0, Jumlah_Izin_Hari: 0, Jumlah_Alpha_Hari: 0, Tunjangan_Makan_Otomatis: 0, Total_Jam_Lembur: 0, Lembur_Rupiah: 0, Lembur_Rupiah_Otomatis: 0, Potongan_Izin: 0, Potongan_Izin_Otomatis: 0, Potongan_Alpha: 0, Potongan_Alpha_Otomatis: 0, Batas_Telat_Gratis: 0, Telat_Kena_Potong: 0, Potongan_Telat_Otomatis: 0 };
    // isManual: true jika kolom ini sudah pernah ditimpa nilai manual (tersimpan bukan kosong) -> tidak akan ikut ter-update otomatis lagi sampai ditekan tombol Update.
    function autoCell(field, effectiveVal, otomatisVal, isManual, caption, widthPx, step) {
      var eff = Number(effectiveVal) || 0;
      var oto = Number(otomatisVal) || 0;
      var outOfSync = isManual && Math.abs(eff - oto) > 0.005;
      var borderColor = outOfSync ? 'var(--red)' : 'var(--border)';
      var capColor = outOfSync ? 'var(--red)' : 'var(--muted)';
      return '<td><div style="display:flex;align-items:center;gap:4px;justify-content:flex-end;">' +
        '<input type="number" ' + (step ? 'step="' + step + '" ' : '') + 'class="komp-input komp-auto-input" data-field="' + field + '" data-auto="' + (isManual ? '0' : '1') + '" data-otomatis="' + esc(round2ForInput_(oto)) + '" value="' + esc(round2ForInput_(eff)) + '" style="width:' + widthPx + 'px;padding:6px 8px;border:1px solid ' + borderColor + ';border-radius:6px;text-align:right;font-weight:600;">' +
        '<button type="button" class="btn-update-oto" onclick="updateKompField(this)" title="Update ke nilai otomatis terbaru dari absensi harian" style="border:none;background:' + (outOfSync ? '#fee2e2' : '#f1f5f9') + ';color:' + capColor + ';border-radius:6px;width:22px;height:22px;line-height:1;cursor:pointer;flex-shrink:0;font-size:12px;">↻</button>' +
        '</div>' +
        (caption ? '<div class="komp-auto-caption" style="color:' + capColor + ';font-size:10px;margin-top:2px;text-align:right;">' + caption + (outOfSync ? ' ⚠️ beda dgn absensi' : '') + '</div>' : '') +
        '</td>';
    }
    var rows = aktif.map(function (k) {
      var kmp = map[k.ID_Karyawan] || {};
      var h = hitungMap[k.ID_Karyawan] || HDEF;
      function kosong(v) { return v === '' || v === undefined || v === null; }
      var hadirManual = !kosong(kmp.Hadir_Manual);
      var makanManual = !kosong(kmp.Tunjangan_Makan_Manual);
      var lemburManual = !kosong(kmp.Lembur_Manual);
      var izinManual = !kosong(kmp.Potongan_Izin_Manual);
      var alphaManual = !kosong(kmp.Potongan_Alpha_Manual);
      var telatManual = !kosong(kmp.Potongan_Telat_Manual);
      var hadirEfektif = hadirManual ? kmp.Hadir_Manual : h.Jumlah_Hadir_Otomatis;
      var makanEfektif = makanManual ? kmp.Tunjangan_Makan_Manual : h.Tunjangan_Makan_Otomatis;
      var lemburEfektif = lemburManual ? kmp.Lembur_Manual : h.Lembur_Rupiah_Otomatis;
      var izinEfektif = izinManual ? kmp.Potongan_Izin_Manual : h.Potongan_Izin_Otomatis;
      var alphaEfektif = alphaManual ? kmp.Potongan_Alpha_Manual : h.Potongan_Alpha_Otomatis;
      var telatEfektif = telatManual ? kmp.Potongan_Telat_Manual : h.Potongan_Telat_Otomatis;
      return '<tr data-idk="' + k.ID_Karyawan + '">' +
        '<td><b>' + esc(k.Nama) + '</b><br><span style="color:var(--muted);font-size:11px;">' + esc(k.Jabatan) + '</span></td>' +
        autoCell('Hadir_Manual', hadirEfektif, h.Jumlah_Hadir_Otomatis, hadirManual, 'P' + (h.Jumlah_Hadir_Penuh || 0) + ' + T' + (h.Jumlah_Telat || 0) + (h.Jumlah_Setengah_Hari ? ' + N' + h.Jumlah_Setengah_Hari : ''), 90, 0.5) +
        autoCell('Tunjangan_Makan_Manual', makanEfektif, h.Tunjangan_Makan_Otomatis, makanManual, 'Hadir × ' + fmtRupiah(rateMakan), 110, null) +
        numInput('Tunjangan', kmp.Tunjangan) + numInput('Reward', kmp.Reward) + numInput('Bonus', kmp.Bonus) + numInput('Tunjangan_Bonus', kmp.Tunjangan_Bonus) +
        autoCell('Lembur_Manual', lemburEfektif, h.Lembur_Rupiah_Otomatis, lemburManual, (h.Total_Jam_Lembur || 0) + ' jam × rate', 110, null) +
        autoCell('Potongan_Izin_Manual', izinEfektif, h.Potongan_Izin_Otomatis, izinManual, (h.Jumlah_Izin_Hari || 0) + ' hari izin', 110, null) +
        autoCell('Potongan_Alpha_Manual', alphaEfektif, h.Potongan_Alpha_Otomatis, alphaManual, (h.Jumlah_Alpha_Hari || 0) + ' hari alpha', 110, null) +
        autoCell('Potongan_Telat_Manual', telatEfektif, h.Potongan_Telat_Otomatis, telatManual, (h.Telat_Kena_Potong || 0) + ' × ' + fmtRupiah(rateTelat), 110, null) +
        numInput('Potongan_SP', kmp.Potongan_SP) + numInput('Pemotongan_Pelanggaran', kmp.Pemotongan_Pelanggaran) + numInput('Potongan_Pinjaman', kmp.Potongan_Pinjaman) +
        '<td><input type="text" class="komp-input" data-field="Keterangan" value="' + esc(kmp.Keterangan || '') + '" style="width:130px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;"></td>' +
        '<td><button class="btn btn-primary btn-sm" onclick="simpanKomponenRow(this)" type="button">Simpan</button></td>' +
      '</tr>';
    }).join('');

    content.innerHTML =
      '<div class="alert alert-info">Semua kolom yang muncul di Slip Gaji ada di tabel ini. Kolom <b>Hadir, Tunj. Makan, Lembur, Pot. Izin, Pot. Alpha, Pot. Telat</b> sudah terisi otomatis sesuai hitungan absensi periode ' + esc(periodeLabel(STATE.periode)) + ' — tinggal dicek kebenarannya, tidak perlu diketik ulang. <b>Semua kolom tetap 100% bisa diedit</b> (tidak dikunci) bila memang perlu dikoreksi manual. Klik <b>Simpan</b> per baris, atau <b>Simpan Semua</b> di atas untuk menyimpan seluruh tabel sekaligus.<br>' +
      '<b>Hadir</b>: otomatis dari absensi Hadir(P)+Telat(T)+Setengah Hari(N=0.5).<br>' +
      '<b>Tunjangan Makan</b>: otomatis dari kolom Hadir × ' + fmtRupiah(rateMakan) + '/hari.<br>' +
      '<b>Lembur (Rp)</b>: otomatis dari jam lembur (diisi di menu Absensi Harian/Rekap Lembur) × rate lembur.<br>' +
      '<b>Potongan Izin</b>: otomatis dari hari izin efektif (mis. kode N "Hadir Setengah Hari" = 0,5 hari izin → gaji harian dikalikan 0,5) × gaji harian.<br>' +
      '<b>Potongan Alpha</b>: otomatis dari jumlah hari Alpha × gaji harian × kelipatan potong.<br>' +
      '<b>Potongan Telat</b>: otomatis dari jumlah telat melebihi toleransi × rate telat. Rate &amp; toleransi telat diatur di Pengaturan → Parameter Telat; rate tunjangan makan di Pengaturan → Parameter Tunjangan Makan.<br>' +
      '<b>⚠️ Kolom bergaris merah</b> berarti nilai yang tersimpan (manual) berbeda dari hitungan absensi terbaru — data absensi berubah setelah baris ini terakhir disimpan. Klik ikon <b>↻</b> di kolom itu (atau tombol <b>🔄 Update Semua dari Absensi</b> di atas tabel) untuk menyamakan dengan absensi terbaru, lalu klik <b>Simpan</b>.</div>' +
      '<div class="toolbar" style="margin-bottom:10px;"><div class="spacer"></div>' +
      '<button class="btn btn-ghost" id="btnUpdateSemuaOtomatis" type="button">🔄 Update Semua dari Absensi</button>' +
      '<button class="btn btn-ghost" id="btnExportKomponenXlsx" type="button">⬇️ Excel</button>' +
      '<button class="btn btn-ghost" id="btnExportKomponenPdf" type="button">📄 PDF</button>' +
      '<button class="btn btn-ghost" id="btnExportKomponenJpg" type="button">🖼️ JPG</button>' +
      '<button class="btn btn-accent" id="btnSimpanSemuaKomponen" type="button">💾 Simpan Semua</button></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Karyawan</th><th>Hadir</th><th>Tunj. Makan</th><th>Tunjangan</th><th>Reward</th><th>Bonus</th><th>Tunj. Bonus</th><th>Lembur</th><th>Pot. Izin</th><th>Pot. Alpha</th><th>Pot. Telat</th><th>Pot. SP</th><th>Pot. Pelanggaran</th><th>Pot. Pinjaman/Kasbon</th><th>Keterangan</th><th></th></tr></thead>' +
      '<tbody>' + (rows || '<tr><td colspan="16"><div class="empty-state">Tidak ada karyawan aktif</div></td></tr>') + '</tbody></table></div>';

    var btnAll = document.getElementById('btnSimpanSemuaKomponen');
    if (btnAll) btnAll.addEventListener('click', simpanSemuaKomponen);
    var btnUpdAll = document.getElementById('btnUpdateSemuaOtomatis');
    if (btnUpdAll) btnUpdAll.addEventListener('click', updateSemuaKomponenOtomatis);
    document.getElementById('btnExportKomponenXlsx').addEventListener('click', function () { eksporKomponenXlsx_(aktif); });
    document.getElementById('btnExportKomponenPdf').addEventListener('click', function () { eksporKomponenTabel_('pdf'); });
    document.getElementById('btnExportKomponenJpg').addEventListener('click', function () { eksporKomponenTabel_('jpg'); });

    // Jika user mengetik manual di kolom otomatis, tandai sebagai override manual (tidak lagi ikut auto-update).
    content.addEventListener('input', function (e) {
      if (e.target.classList && e.target.classList.contains('komp-auto-input')) {
        e.target.setAttribute('data-auto', '0');
      }
    });
  });
}

function eksporKomponenXlsx_(aktif) {
  var trs = document.querySelectorAll('#content tr[data-idk]');
  var namaMap = {}; aktif.forEach(function (k) { namaMap[k.ID_Karyawan] = k; });
  var data = [];
  trs.forEach(function (tr) {
    var idk = tr.getAttribute('data-idk');
    var k = namaMap[idk] || {};
    var row = { Karyawan: k.Nama || idk, Jabatan: k.Jabatan || '' };
    tr.querySelectorAll('.komp-input').forEach(function (inp) {
      var field = inp.getAttribute('data-field');
      row[field] = inp.value;
    });
    data.push(row);
  });
  exportArrayToXlsx_(data, 'Komponen_Gaji_' + STATE.periode);
}

function eksporKomponenTabel_(tipe) {
  var tableEl = document.querySelector('#content .table-wrap table');
  jalankanEksporTabel_(tipe, 'Komponen Gaji — Wonderland Park Samarinda', 'Periode: ' + periodeRangeLabel(STATE.periode) + ' (' + STATE.periode + ')', tableEl, null, 'Komponen_Gaji_' + STATE.periode);
}

// Reset satu kolom otomatis (Hadir/Tunj.Makan/Lembur/Pot.Izin/Pot.Alpha/Pot.Telat) ke nilai terbaru hasil hitung absensi.
function updateKompFieldCore_(btn) {
  var wrap = btn.closest('td');
  var inp = wrap.querySelector('input.komp-auto-input');
  if (!inp) return;
  inp.value = inp.getAttribute('data-otomatis');
  inp.setAttribute('data-auto', '1');
  inp.style.border = '1px solid var(--border)';
  var cap = wrap.querySelector('.komp-auto-caption');
  if (cap) {
    cap.style.color = 'var(--muted)';
    cap.textContent = cap.textContent.replace(' ⚠️ beda dgn absensi', '');
  }
  var updBtn = wrap.querySelector('.btn-update-oto');
  if (updBtn) { updBtn.style.background = '#f1f5f9'; updBtn.style.color = 'var(--muted)'; }
}

function updateKompField(btn) {
  updateKompFieldCore_(btn);
  toast('Nilai diperbarui sesuai absensi terbaru. Klik Simpan untuk menyimpan.', 'info');
}

function updateSemuaKomponenOtomatis() {
  var btns = document.querySelectorAll('#content .btn-update-oto');
  if (!btns.length) { toast('Tidak ada kolom untuk diupdate', 'info'); return; }
  btns.forEach(function (b) { updateKompFieldCore_(b); });
  toast('Semua kolom otomatis (Hadir, Tunj. Makan, Lembur, Pot. Izin, Pot. Alpha, Pot. Telat) diperbarui sesuai absensi terbaru. Klik Simpan Semua untuk menyimpan.', 'success');
}

function round2ForInput_(n) {
  n = Number(n) || 0;
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

function numInput(field, val) {
  return '<td><input type="number" class="komp-input" data-field="' + field + '" value="' + (val || 0) + '" style="width:100px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;"></td>';
}

// Ambil nilai input untuk disimpan. Kolom otomatis (Hadir/Tunj.Makan/Lembur/Pot.Izin/Pot.Alpha/Pot.Telat) yang
// masih berstatus "auto" (belum pernah ditimpa manual, atau baru ditekan tombol Update) dikirim kosong ('')
// agar backend tetap menghitungnya otomatis dari absensi setiap periode dibuka, bukan membekukan angkanya.
function komponenInputValue_(inp) {
  if (inp.classList.contains('komp-auto-input') && inp.getAttribute('data-auto') === '1') return '';
  return inp.value;
}

function simpanKomponenRow(btn) {
  var tr = btn.closest('tr');
  var idk = tr.getAttribute('data-idk');
  var existing = CURRENT_KOMPONEN_MAP[idk] || {};
  var payload = { ID_Karyawan: idk, Periode: STATE.periode };
  tr.querySelectorAll('.komp-input').forEach(function (inp) { payload[inp.getAttribute('data-field')] = komponenInputValue_(inp); });
  btn.disabled = true; btn.textContent = '...';
  gsRun('saveKomponenGaji', STATE.token, payload).then(function () {
    btn.disabled = false; btn.textContent = 'Simpan';
    CURRENT_KOMPONEN_MAP[idk] = Object.assign({}, existing, payload);
    toast('Komponen gaji tersimpan', 'success');
  }).catch(function (err) { btn.disabled = false; btn.textContent = 'Simpan'; toast('Gagal: ' + (err.message || err), 'error'); });
}

function simpanSemuaKomponen() {
  var btn = document.getElementById('btnSimpanSemuaKomponen');
  var trs = document.querySelectorAll('#content tr[data-idk]');
  if (!trs.length) { toast('Tidak ada baris untuk disimpan', 'info'); return; }
  var payloads = [];
  trs.forEach(function (tr) {
    var idk = tr.getAttribute('data-idk');
    var payload = { ID_Karyawan: idk, Periode: STATE.periode };
    tr.querySelectorAll('.komp-input').forEach(function (inp) { payload[inp.getAttribute('data-field')] = komponenInputValue_(inp); });
    payloads.push(payload);
  });
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  gsRun('saveKomponenGajiBulk', STATE.token, payloads).then(function (res) {
    btn.disabled = false; btn.textContent = '💾 Simpan Semua';
    payloads.forEach(function (p) { CURRENT_KOMPONEN_MAP[p.ID_Karyawan] = Object.assign({}, CURRENT_KOMPONEN_MAP[p.ID_Karyawan] || {}, p); });
    toast(res.message, 'success');
  }).catch(function (err) { btn.disabled = false; btn.textContent = '💾 Simpan Semua'; toast('Gagal: ' + (err.message || err), 'error'); });
}

/* ============================================================================
   PERHITUNGAN GAJI (DENGAN 2 SUBMENU)

var LAST_PERHITUNGAN = null;
var PERHITUNGAN_ACTIVE_TAB = 'potongan'; // default 'potongan' (Gaji + POT)

        '<div class="spacer"></div>' +
        (bisaKelola && !isFinal ? '<button class="btn btn-primary" id="btnFinalisasiGaji" type="button">✅ Finalisasi Data</button>' : '') +
        (bisaKelola && isFinal ? '<button class="btn btn-accent" id="btnHitungUlangGaji" type="button">🔁 Hitung Ulang</button>' : '') +
        '<button class="btn btn-ghost" id="btnExportPerhitunganXlsx" type="button">⬇️ Excel</button>' +
        '<button class="btn btn-ghost" id="btnExportPerhitunganPdf" type="button">⬇️ PDF</button>' +
        '<button class="btn btn-ghost" id="btnExportPerhitunganJpg" type="button">🖼️ JPG</button>' +
      '</div>' +
      '<div class="tabs" id="perhitunganTabs">' +
        '<div class="tab-item' + (PERHITUNGAN_ACTIVE_TAB === 'potongan' ? ' active' : '') + '" data-tab="potongan">Gaji + POT (Potongan)</div>' +
        '<div class="tab-item' + (PERHITUNGAN_ACTIVE_TAB === 'tanpa' ? ' active' : '') + '" data-tab="tanpa">Gaji Tanpa Potongan</div>' +
      '</div>' +
      '<div id="perhitunganTabContent"></div>';

    document.getElementById('perhitunganTabs').addEventListener('click', function(e) {
      var t = e.target.closest('.tab-item');
      if (!t) return;
      document.querySelectorAll('#perhitunganTabs .tab-item').forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
      PERHITUNGAN_ACTIVE_TAB = t.getAttribute('data-tab');
      renderPerhitunganTab(PERHITUNGAN_ACTIVE_TAB);
    });
    renderPerhitunganTab(PERHITUNGAN_ACTIVE_TAB);

    document.getElementById('btnExportPerhitunganXlsx').addEventListener('click', exportPerhitunganXlsx);
    document.getElementById('btnExportPerhitunganPdf').addEventListener('click', exportPerhitunganPdf);
    document.getElementById('btnExportPerhitunganJpg').addEventListener('click', exportPerhitunganJpg);
    var btnFinal = document.getElementById('btnFinalisasiGaji');
    if (btnFinal) btnFinal.addEventListener('click', function () { finalisasiPerhitunganGaji(btnFinal); });
    var btnUlang = document.getElementById('btnHitungUlangGaji');
    if (btnUlang) btnUlang.addEventListener('click', function () { hitungUlangPerhitunganGaji(btnUlang); });
  });
}

function finalisasiPerhitunganGaji(btn) {
  if (!confirm('Finalisasi data gaji periode ' + periodeRangeLabel(STATE.periode) + '?\n\nSetelah difinalisasi, slip gaji & rekap akan memakai data yang dibekukan (snapshot) ini, walau data absensi/komponen diedit belakangan. Jika ada kesalahan, gunakan "Hitung Ulang" nanti.')) return;
  var oldText = btn.textContent;
  btn.disabled = true; btn.textContent = 'Memproses...';
  gsRun('finalisasiGaji', STATE.token, STATE.periode).then(function (res) {
    toast(res.message || 'Data berhasil difinalisasi', 'success');
    return gsRun('getPeriodeList', STATE.token);
  }).then(function (list) {
    STATE.periodeList = list;
    renderPeriodeSelector();
    navigate('perhitungan', true);
  }).catch(function (err) {
    btn.disabled = false; btn.textContent = oldText;
    toast('Gagal: ' + (err.message || err), 'error');
  });
}

function hitungUlangPerhitunganGaji(btn) {
  if (!confirm('Hitung ulang data gaji final periode ' + periodeRangeLabel(STATE.periode) + '?\n\nGunakan ini hanya jika ada kesalahan pada data yang sudah final (mis. absensi/komponen baru saja diperbaiki). Data final akan ditimpa dengan hasil hitungan terbaru.')) return;
  var oldText = btn.textContent;
  btn.disabled = true; btn.textContent = 'Menghitung ulang...';
  gsRun('hitungUlangGaji', STATE.token, STATE.periode).then(function (res) {
    toast(res.message || 'Perhitungan ulang selesai', 'success');
    navigate('perhitungan', true);
  }).catch(function (err) {
    btn.disabled = false; btn.textContent = oldText;
    toast('Gagal: ' + (err.message || err), 'error');
  });
}

  var zebraFlag = String(val('EXPORT_ZEBRA_AKTIF')).toUpperCase();
  return {
    utamaHex: val('EXPORT_WARNA_UTAMA'),
    utama: hexToArgb_(val('EXPORT_WARNA_UTAMA')),
    teksHeader: hexToArgb_(val('EXPORT_WARNA_TEKS_HEADER')),
    totalBgHex: val('EXPORT_WARNA_TOTAL'),
    totalBg: hexToArgb_(val('EXPORT_WARNA_TOTAL')),

    zebraHex: val('EXPORT_WARNA_ZEBRA'),
    zebra: hexToArgb_(val('EXPORT_WARNA_ZEBRA')),
    zebraAktif: zebraFlag !== 'N' && zebraFlag !== 'TIDAK' && zebraFlag !== '0'
  };
}

function hexToArgb_(hex) {
  hex = String(hex || '#94a3b8').replace('#', '').trim().toUpperCase();
  if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
  if (hex.length !== 6) hex = '94A3B8';
  return 'FF' + hex;
}

// Meniru efek "warna+'22'" (alpha ~13%) yang dipakai di web: warna kode absensi
// dicampur (blend) dengan putih supaya jadi versi pucat sebagai latar sel.
function tintHex_(hex, alpha) {
  hex = String(hex || '#94a3b8').replace('#', '').trim();
  if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
  if (hex.length !== 6) hex = '94a3b8';
  var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
  var mix = function (v) {
    var out = Math.round(v * alpha + 255 * (1 - alpha));
    var s = out.toString(16).toUpperCase();
    return s.length === 1 ? '0' + s : s;
  };
  return 'FF' + mix(r) + mix(g) + mix(b);
}

function downloadWorkbook_(wb, filename) {
  return wb.xlsx.writeBuffer().then(function (buffer) {
    var blob = new Blob([buffer], { type: 'application/octet-stream' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename + '.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }).catch(function (err) {
    toast('Gagal membuat file Excel: ' + (err && err.message ? err.message : err), 'error');
  });
}

// 3 baris judul di atas tabel: nama perusahaan, judul laporan, periode. Digabung (merge)
// selebar jumlah kolom tabel supaya rapi & terlihat profesional saat dibuka di Excel.
function addTitleRows_(ws, totalCols, perusahaan, judul, periodeLabel) {
  var style = getExportStyleFromState_();
  totalCols = Math.max(totalCols, 1);
  ws.mergeCells(1, 1, 1, totalCols);
  var r1 = ws.getRow(1);
  r1.getCell(1).value = perusahaan;
  r1.getCell(1).font = { bold: true, size: 14, color: { argb: 'FF0F172A' } };
  r1.getCell(1).alignment = { horizontal: 'left', vertical: 'middle' };
  r1.height = 22;

  ws.mergeCells(2, 1, 2, totalCols);
  var r2 = ws.getRow(2);
  r2.getCell(1).value = judul;
  r2.getCell(1).font = { bold: true, size: 11, color: { argb: style.utama } };
  r2.getCell(1).alignment = { horizontal: 'left', vertical: 'middle' };

  ws.mergeCells(3, 1, 3, totalCols);
  var r3 = ws.getRow(3);
  r3.getCell(1).value = periodeLabel;
  r3.getCell(1).font = { italic: true, size: 10, color: { argb: 'FF64748B' } };
  r3.getCell(1).alignment = { horizontal: 'left', vertical: 'middle' };
}

function styleHeaderRow_(row, totalCols) {
  var style = getExportStyleFromState_();
  for (var c = 1; c <= totalCols; c++) {
    var cell = row.getCell(c);
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: style.utama } };
    cell.font = { bold: true, color: { argb: style.teksHeader }, size: 10 };
    cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
    cell.border = THIN_BORDER_;
  }
  row.height = 26;
}

// Mengubah nomor kolom (1-indexed) jadi huruf kolom Excel (1->A, 27->AA, dst).
function colLetter_(n) {
  var s = '';
  while (n > 0) {
    var m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

// Sheet "Parameter Perhitungan" berisi semua rate/parameter (Divisor Hari, Rate Lembur,
// Rate Telat, dst.) yang dipakai formula-formula di sheet Gaji. Kalau nilai di sini diubah,
// SEMUA formula turunan di sheet Gaji ikut menghitung ulang otomatis — logika 100% sama
// dengan hitungGajiPeriode() di web app.
var PARAM_SHEET_NAME_ = 'Parameter Perhitungan';
var PARAM_ROWS_ = { DIVISOR_HARI: 2, LEMBUR_BASIS_JAM: 3, LEMBUR_MULTIPLIER: 4, RATE_TELAT: 5, BATAS_TELAT_GRATIS: 6, RATE_TUNJANGAN_MAKAN: 7 };
function paramRef_(key) { return "'" + PARAM_SHEET_NAME_ + "'!$B$" + PARAM_ROWS_[key]; }

function buildParameterSheet_(wb, parameter) {
  if (wb.getWorksheet(PARAM_SHEET_NAME_)) return wb.getWorksheet(PARAM_SHEET_NAME_);
  var p = parameter || {};
  var ws = wb.addWorksheet(PARAM_SHEET_NAME_);
  var headerRow = ws.getRow(1);
  headerRow.getCell(1).value = 'Parameter'; headerRow.getCell(2).value = 'Nilai'; headerRow.getCell(3).value = 'Keterangan';
  styleHeaderRow_(headerRow, 3);
  var list = [
    ['DIVISOR_HARI', Number(p.divisorHari) || 31, 'Pembagi Gaji Pokok menjadi Gaji per Hari. Dipakai formula kolom "Gaji/Hari".'],
    ['LEMBUR_BASIS_JAM', Number(p.lemburBasisJam) || 173, 'Basis jam kerja sebulan untuk menghitung rate lembur per jam. Dipakai formula kolom "Lembur (Rp)".'],
    ['LEMBUR_MULTIPLIER', Number(p.lemburMultiplier) || 2, 'Pengali rate lembur per jam. Dipakai formula kolom "Lembur (Rp)".'],
    ['RATE_TELAT', Number(p.rateTelat) || 25000, 'Potongan (Rp) per kejadian telat yang kena potong. Dipakai formula kolom "Pot. Telat".'],
    ['BATAS_TELAT_GRATIS', Number(p.batasTelatGratis) || 0, 'Jumlah telat yang masih dibebaskan dari potongan per periode. Dipakai formula kolom "Pot. Telat".'],
    ['RATE_TUNJANGAN_MAKAN', Number(p.rateTunjanganMakan) || 0, 'Tunjangan makan (Rp) per hari hadir efektif. Dipakai formula kolom "Tunj. Makan".']
  ];
  list.forEach(function (r, i) {
    var row = ws.getRow(i + 2);
    row.getCell(1).value = r[0];
    row.getCell(2).value = r[1];
    row.getCell(2).numFmt = '#,##0.####';
    row.getCell(2).font = { bold: true };
    row.getCell(3).value = r[2];
    row.getCell(3).alignment = { wrapText: true };
    for (var c = 1; c <= 3; c++) row.getCell(c).border = THIN_BORDER_;
  });
  ws.getColumn(1).width = 24; ws.getColumn(2).width = 16; ws.getColumn(3).width = 62;
  ws.getRow(1).height = 22;
  var noteRowIdx = list.length + 3;
  ws.mergeCells(noteRowIdx, 1, noteRowIdx, 3);
  ws.getCell(noteRowIdx, 1).value = 'Semua kolom hasil hitung (Gaji/Hari, Tunj. Makan, Lembur (Rp), Pot. Telat, Gaji Bersih/Gaji Kotor) di sheet Gaji sudah berupa RUMUS Excel yang merujuk parameter di sheet ini. Ubah nilai "Nilai" di atas → seluruh sheet Gaji otomatis menghitung ulang.';
  ws.getCell(noteRowIdx, 1).font = { italic: true, size: 9, color: { argb: 'FF64748B' } };
  ws.getCell(noteRowIdx, 1).alignment = { wrapText: true };
  ws.getRow(noteRowIdx).height = 32;
  return ws;
}

var EXPORT_RUPIAH_HEADERS_ = ['Gaji Pokok', 'Gaji/Hari', 'Tunj. Makan', 'Tunjangan', 'Reward', 'Bonus', 'Tunj. Bonus', 'Lembur (Rp)', 'Pot. Izin', 'Pot. Telat', 'Pot. Alpha', 'Pot. Pinjaman', 'Pot. SP', 'Pot. Pelanggaran', 'Gaji Bersih', 'Gaji Kotor'];

// Bangun 1 sheet tabel keuangan (perhitungan gaji, komponen gaji, dsb.) yang rapi:
// judul + periode di atas, header gelap, kolom Rupiah diformat "Rp #.###", baris
// selang-seling (zebra), baris TOTAL ditebalkan dengan border ganda di atasnya.
function buildTabelKeuanganSheet_(ws, opts) {
  var style = getExportStyleFromState_();
  var headers = opts.headers, rows = opts.rows, totalsRow = opts.totalsRow;
  var rupiahHeaders = opts.rupiahHeaders || EXPORT_RUPIAH_HEADERS_;
  var totalCols = headers.length;
  var formulaMap = opts.formulaMap || null;
  var colIndex = {};
  headers.forEach(function (h, i) { colIndex[h] = i + 1; });

  addTitleRows_(ws, totalCols, opts.perusahaan, opts.judul, opts.periodeLabel);

  var headerRowIdx = 5;
  var headerRow = ws.getRow(headerRowIdx);
  headers.forEach(function (h, i) { headerRow.getCell(i + 1).value = h; });
  styleHeaderRow_(headerRow, totalCols);
  if (opts.headerNotes) {
    Object.keys(opts.headerNotes).forEach(function (h) {
      if (colIndex[h]) headerRow.getCell(colIndex[h]).note = opts.headerNotes[h];
    });
  }
  ws.autoFilter = { from: { row: headerRowIdx, column: 1 }, to: { row: headerRowIdx, column: totalCols } };
  ws.views = [{ state: 'frozen', ySplit: headerRowIdx }];

  var firstDataRow = headerRowIdx + 1;
  var lastDataRow = headerRowIdx + rows.length;

  rows.forEach(function (r, rIdx) {
    var rowNum = firstDataRow + rIdx;
    var row = ws.getRow(rowNum);
    r.forEach(function (v, i) {
      var cell = row.getCell(i + 1);
      var h = headers[i];
      cell.value = (v === '' || v === null || v === undefined) ? null : v;
      cell.border = THIN_BORDER_;
      cell.font = { size: 10 };
      if (typeof v === 'number') {
        if (rupiahHeaders.indexOf(h) !== -1) { cell.numFmt = '"Rp" #,##0'; }
        else if (h.indexOf('Jam') !== -1) { cell.numFmt = '0.0'; }
        cell.alignment = { horizontal: 'right', vertical: 'middle' };
      } else {
        cell.alignment = { horizontal: (i <= 2 ? 'left' : 'center'), vertical: 'middle' };
      }
    });

    // Timpa kolom hasil hitung dengan RUMUS Excel (logika sama persis dengan hitungGajiPeriode()
    // di web app), supaya kalau ada data mentah yang diubah manual di Excel, kolom ini otomatis
    // menghitung ulang — bukan sekadar angka statis hasil salinan.
    if (formulaMap) {
      var ref = function (h2) { return colLetter_(colIndex[h2]) + rowNum; };
      Object.keys(formulaMap).forEach(function (h3) {
        if (!colIndex[h3]) return;
        var cell = row.getCell(colIndex[h3]);
        var f = formulaMap[h3](rowNum, ref);
        if (f) {
          var cached = cell.value;
          cell.value = { formula: f, result: (typeof cached === 'number' ? cached : 0) };
        }
      });
    }

    if (style.zebraAktif && rIdx % 2 === 1) {
      row.eachCell({ includeEmpty: true }, function (cell) {
        if (!cell.fill) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: style.zebra } };
      });
    }
  });

  if (totalsRow) {
    var totalsRowIdx = lastDataRow + 1;
    var tRow = ws.getRow(totalsRowIdx);
    totalsRow.forEach(function (v, i) {
      var cell = tRow.getCell(i + 1);
      var h = headers[i];
      cell.value = (v === '' || v === null || v === undefined) ? null : v;
      if (typeof v === 'number') {
        // Baris TOTAL juga rumus SUM() atas seluruh baris data, bukan angka statis —
        // otomatis ikut berubah kalau ada baris/kolom di atasnya yang direvisi.
        if (rows.length > 0) {
          var colLetterX = colLetter_(i + 1);
          cell.value = { formula: 'SUM(' + colLetterX + firstDataRow + ':' + colLetterX + lastDataRow + ')', result: v };
        }
        if (rupiahHeaders.indexOf(h) !== -1) cell.numFmt = '"Rp" #,##0';
        cell.alignment = { horizontal: 'right' };
      }
      cell.font = { bold: true, size: 10, color: { argb: style.teksTotal } };
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: style.totalBg } };
      cell.border = {
        top: { style: 'double', color: { argb: style.utama } },
        bottom: { style: 'thin', color: { argb: 'FFE2E8F0' } },
        left: { style: 'thin', color: { argb: 'FFE2E8F0' } },
        right: { style: 'thin', color: { argb: 'FFE2E8F0' } }
      };
    });
  }

  headers.forEach(function (h, i) {
    var maxLen = h.length;
    rows.forEach(function (r) {
      var v = r[i];
      var len = (v === null || v === undefined) ? 0 : String(v).length;
      if (len > maxLen) maxLen = len;
    });
    ws.getColumn(i + 1).width = Math.min(Math.max(maxLen + 3, 9), 26);
  });
}

  return {

      'Pot. Alpha': 'Nilai final dari sistem (memperhitungkan porsi & kelipatan potong per kode absensi, bisa berbeda tiap kode). Bukan rumus — ubah data Absensi lalu export ulang jika perlu update.'
    },
    formulaMap: {
      'Gaji/Hari': function (rowNum, ref) { return ref('Gaji Pokok') + '/' + paramRef_('DIVISOR_HARI'); },
      'Tunj. Makan': function (rowNum, ref) { return ref('Jml Hadir') + '*' + paramRef_('RATE_TUNJANGAN_MAKAN'); },

// Menambahkan 1 sheet tabel Perhitungan Gaji (Rp diformat rapi, header oranye, dsb.) ke
// workbook (wb) yang diberikan — dipakai baik untuk export mandiri maupun Laporan Gabungan.
function addPerhitunganSheetToWorkbook_(wb, sheetName, table, perusahaan) {
  if (table.parameter) buildParameterSheet_(wb, table.parameter);
  var ws = wb.addWorksheet(sheetName, { properties: { defaultRowHeight: 18 } });
  buildTabelKeuanganSheet_(ws, {
    perusahaan: perusahaan || 'WONDERLAND PARK SAMARINDA',
    judul: table.title.toUpperCase(),
    periodeLabel: 'Periode: ' + periodeRangeLabel(STATE.periode) + ' (' + STATE.periode + ')',
    headers: table.headers,
    rows: table.rows,
    totalsRow: table.totalsRow,
    formulaMap: table.formulaMap,
    headerNotes: table.headerNotes
  });
  return ws;
}

function exportPerhitunganXlsx() {

function exportPerhitunganPdf() {

    try { doc.addImage('data:' + b.logoMime + ';base64,' + b.logoBase64, pdfImgFormat_(b.logoMime), 14, 6, 20, 13); top = 26; } catch (e) { /* abaikan */ }
  }
  doc.setFontSize(14); doc.text((b.perusahaan || 'GAJI KARYAWAN'), 14, top);
  doc.setFontSize(10); doc.text(table.title.toUpperCase() + ' — PERIODE ' + periodeRangeLabel(STATE.periode).toUpperCase(), 14, top + 6);
  var fmtCell = function (v, header) {
    if (v === '' || v === null || v === undefined) return '';
    if (typeof v === 'number' && EXPORT_RUPIAH_HEADERS_.indexOf(header) !== -1) return fmtRupiah(v);
    return String(v);
  };
  var bodyFormatted = table.rows.map(function (r) { return r.map(function (v, i) { return fmtCell(v, table.headers[i]); }); });
  var footFormatted = table.totalsRow.map(function (v, i) { return fmtCell(v, table.headers[i]); });
  doc.autoTable({
    head: [table.headers], body: bodyFormatted, foot: [footFormatted], showFoot: 'lastPage',
    startY: top + 12, styles: { fontSize: 7 }, headStyles: { fillColor: [30, 41, 59] }, footStyles: { fillColor: [241, 245, 249], textColor: [15, 23, 42], fontStyle: 'bold' }
  });
  doc.save('Perhitungan_Gaji_' + table.fileTag + STATE.periode + '.pdf');
}

function exportArrayToXlsx_(data, filename) {

}

  doc.setFontSize(13); doc.text(res.perusahaan, 105, headTop, { align: 'center' });

function tambahBlokTandaTanganPdf_(doc, res, namaKaryawan) {
  var s = res.slip || {};
  var finalY = (doc.lastAutoTable && doc.lastAutoTable.finalY) || 40;
  var y = finalY + 12;
  if (y + 45 > 285) { doc.addPage(); y = 20; }

  doc.setFontSize(9); doc.setTextColor(20);
  doc.text(((s.tempat ? s.tempat + ', ' : '') + (s.tanggalLengkap || '')), 196, y, { align: 'right' });

  var lineY = y + 32;
  var col1 = 55, col2 = 155;
  if (s.ttdBase64) {
    try { doc.addImage('data:' + s.ttdMime + ';base64,' + s.ttdBase64, pdfImgFormat_(s.ttdMime), col2 - 20, lineY - 22, 40, 20); } catch (e) { /* abaikan */ }
  }
  doc.setDrawColor(120); doc.setLineWidth(0.2);
  doc.line(col1 - 25, lineY, col1 + 25, lineY);
  doc.line(col2 - 25, lineY, col2 + 25, lineY);
  doc.setFontSize(9);
  doc.text('Karyawan', col1, lineY + 5, { align: 'center' });
  doc.text('(  ' + namaKaryawan + '  )', col1, lineY + 10, { align: 'center' });
  doc.text(s.jabatanManajer || 'Manager Operasional', col2, lineY + 5, { align: 'center' });
  doc.text('(  ' + (s.namaManajer || '-') + '  )', col2, lineY + 10, { align: 'center' });
}

// Download SEMUA slip gaji dalam 1 file PDF, A4 POTRAIT, 4 slip per halaman (2 kolom x 2 baris, hemat kertas)
// Logo pada tiap slip diposisikan di kiri atas (lihat drawSlipBoxPdf_)
function eksporSemuaSlipXlsx_(res) {
  var items = res.items;
  if (!items || items.length === 0) { toast('Tidak ada data gaji untuk periode ini', 'error'); return; }
  var data = items.map(function (d) {
    return {
      Nama: d.Nama, Jabatan: d.Jabatan, ID_Karyawan: d.ID_Karyawan,
      Gaji_Pokok: d.Gaji_Pokok, Hari_Hadir: d.Jumlah_Hadir, Tunjangan_Makan: d.Tunjangan_Makan,
      Tunjangan: d.Tunjangan, Reward: d.Reward, Bonus: d.Bonus, Tunjangan_Bonus: d.Tunjangan_Bonus,
      Jam_Lembur: d.Total_Jam_Lembur, Lembur_Rp: d.Lembur_Rupiah, Total_Pendapatan: d.Total_Pendapatan,
      Jml_Izin: (d.Jumlah_Izin_Hari || 0), Potongan_Izin: d.Potongan_Izin,
      Jml_Alpha: (d.Jumlah_Alpha_Hari || 0), Potongan_Alpha: d.Potongan_Alpha,
      Potongan_Telat: d.Potongan_Telat, Potongan_SP: d.Potongan_SP, Pemotongan_Pelanggaran: d.Pemotongan_Pelanggaran,
      Potongan_Pinjaman: d.Potongan_Pinjaman, Total_Potongan: d.Total_Potongan, Gaji_Bersih: d.Gaji_Bersih
    };
  });
  exportArrayToXlsx_(data, 'Semua_Slip_Gaji_' + STATE.periode);
}

function downloadAllSlipsPdf_(res) {
  var items = res.items;
  if (!items || items.length === 0) { toast('Tidak ada data gaji untuk periode ini', 'error'); return; }
  var doc = new jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  var pageW = 210, pageH = 297, cols = 2, rows = 2, marginX = 6, marginY = 6;
  var cellW = (pageW - marginX * 2) / cols;
  var cellH = (pageH - marginY * 2) / rows;

  // Logo untuk di setiap slip box
  var logoDataUrl = null;
  if (res.logoBase64) {
    logoDataUrl = 'data:' + res.logoMime + ';base64,' + res.logoBase64;
  }

  items.forEach(function (d, idx) {
    var posInPage = idx % 4;
    if (idx > 0 && posInPage === 0) doc.addPage();
    var col = posInPage % cols;
    var row = Math.floor(posInPage / cols);
    var x = marginX + col * cellW;
    var y = marginY + row * cellH;
    drawSlipBoxPdf_(doc, x, y, cellW, cellH, res.perusahaan, res.alamat, res.periode, d, res.slip || {}, logoDataUrl);
  });
  doc.save('Semua_Slip_Gaji_' + STATE.periode + '.pdf');
}

// Logo diposisikan di kiri atas setiap kotak slip. Setiap komponen pendapatan & potongan
// ditampilkan sebagai baris TERPISAH sesuai urutan aslinya, TIDAK digabung jadi satu baris.
function drawSlipBoxPdf_(doc, x, y, w, h, perusahaan, alamat, periode, d, slipSet, logoDataUrl) {
  doc.setDrawColor(170); doc.setLineWidth(0.2);
  doc.rect(x + 2, y + 2, w - 4, h - 4);
  var cx = x + w / 2;
  var ty = y + 7;
  doc.setTextColor(20);

  // Logo (tengah atas kotak slip)
  if (logoDataUrl) {
    try {
      doc.addImage(logoDataUrl, 'PNG', cx - 12, y + 3, 24, 8); // Posisi tengah atas, ukuran 24x8mm
      ty += 6;
    } catch (e) { /* abaikan */ }
  }

  doc.setFont(undefined, 'bold'); doc.setFontSize(9.5);
  doc.text(String(perusahaan || ''), cx, ty, { align: 'center' });
  doc.setFont(undefined, 'normal'); doc.setFontSize(6.5); doc.setTextColor(100);
  ty += 3.6; doc.text(String(alamat || ''), cx, ty, { align: 'center' });
  doc.setTextColor(20); doc.setFont(undefined, 'bold'); doc.setFontSize(7.5);
  ty += 4.6; doc.text('SLIP GAJI — ' + periodeRangeLabel(periode).toUpperCase(), cx, ty, { align: 'center' });
  doc.setFont(undefined, 'normal'); doc.setFontSize(7);
  ty += 5;
  doc.text('Nama : ' + d.Nama, x + 5, ty); ty += 3.6;
  doc.text('Jabatan : ' + (d.Jabatan || '-'), x + 5, ty); ty += 3.6;
  doc.text('ID : ' + d.ID_Karyawan, x + 5, ty); ty += 4;
  doc.setDrawColor(200); doc.line(x + 5, ty - 2, x + w - 5, ty - 2);

  // PENDAPATAN — setiap komponen baris sendiri, urutan sama seperti slip individu
  doc.setFont(undefined, 'bold'); doc.setFontSize(6.8); doc.setTextColor(30);
  doc.text('PENDAPATAN', x + 5, ty); ty += 3.4;
  doc.setFont(undefined, 'normal'); doc.setFontSize(6.6);
  var pendapatan = [
    ['Gaji Pokok', fmtRupiah(d.Gaji_Pokok)],
    ['Tunjangan Makan (' + d.Jumlah_Hadir + 'h)', fmtRupiah(d.Tunjangan_Makan)],
    ['Tunjangan', fmtRupiah(d.Tunjangan)],
    ['Reward', fmtRupiah(d.Reward)],
    ['Bonus', fmtRupiah(d.Bonus)],
    ['Tunjangan Bonus', fmtRupiah(d.Tunjangan_Bonus)],
    ['Lembur (' + d.Total_Jam_Lembur + ' jam)', fmtRupiah(d.Lembur_Rupiah)]
  ];
  pendapatan.forEach(function (l) {
    doc.setTextColor(60);
    doc.text(String(l[0]), x + 5, ty);
    doc.text(String(l[1]), x + w - 5, ty, { align: 'right' });
    ty += 3.2;
  });
  ty += 0.8;
  doc.setDrawColor(210); doc.setLineWidth(0.15); doc.line(x + 5, ty, x + w - 5, ty);
  ty += 3.3;
  doc.setFont(undefined, 'bold'); doc.setTextColor(20);
  doc.text('Total Pendapatan', x + 5, ty);
  doc.text(fmtRupiah(d.Total_Pendapatan), x + w - 5, ty, { align: 'right' });
  ty += 4;

  // POTONGAN — setiap komponen baris sendiri (Pot. SP, Pemotongan Pelanggaran, Pot. Pinjaman TIDAK digabung)
  doc.setFont(undefined, 'bold'); doc.setFontSize(6.8); doc.setTextColor(30);
  doc.text('POTONGAN', x + 5, ty); ty += 3.4;
  doc.setFont(undefined, 'normal'); doc.setFontSize(6.6);
  var potongan = [
    ['Potongan Izin (' + (d.Jumlah_Izin_Hari || 0) + 'h)', fmtRupiah(d.Potongan_Izin)],
    ['Potongan Alpha (' + (d.Jumlah_Alpha_Hari || 0) + 'h)', fmtRupiah(d.Potongan_Alpha)],
    ['Potongan Telat (' + d.Telat_Kena_Potong + '/' + d.Jumlah_Telat + 'x)', fmtRupiah(d.Potongan_Telat)],
    ['Potongan SP', fmtRupiah(d.Potongan_SP)],
    ['Pemotongan Pelanggaran', fmtRupiah(d.Pemotongan_Pelanggaran)],
    ['Potongan Pinjaman/Kasbon', fmtRupiah(d.Potongan_Pinjaman)]
  ];
  potongan.forEach(function (l) {
    doc.setTextColor(60);
    doc.text(String(l[0]), x + 5, ty);
    doc.text('-' + String(l[1]), x + w - 5, ty, { align: 'right' });
    ty += 3.2;
  });
  ty += 0.8;
  doc.setDrawColor(210); doc.setLineWidth(0.15); doc.line(x + 5, ty, x + w - 5, ty);
  ty += 3.3;
  doc.setFont(undefined, 'bold'); doc.setTextColor(20);
  doc.text('Total Potongan', x + 5, ty);
  doc.text('-' + fmtRupiah(d.Total_Potongan), x + w - 5, ty, { align: 'right' });
  ty += 4.5;

  doc.setDrawColor(120); doc.line(x + 5, ty, x + w - 5, ty); ty += 4;
  doc.setFont(undefined, 'bold'); doc.setFontSize(8.2); doc.setTextColor(22, 101, 52);
  doc.text('GAJI DITERIMA', x + 5, ty);
  doc.text(fmtRupiah(d.Gaji_Bersih), x + w - 5, ty, { align: 'right' });
  doc.setTextColor(0); doc.setFont(undefined, 'normal');

  // Terbilang
  ty += 3.4;
  doc.setFont(undefined, 'italic'); doc.setFontSize(5.6); doc.setTextColor(90);
  var terbilangText = 'Terbilang: ' + terbilangRupiah_(d.Gaji_Bersih);
  var wrappedTerbilang = doc.splitTextToSize(terbilangText, w - 10);
  doc.text(wrappedTerbilang, x + 5, ty);
  ty += wrappedTerbilang.length * 2.7 + 1.5;
  doc.setFont(undefined, 'normal'); doc.setTextColor(60);

  var s = slipSet || {};
  ty += 2.5;
  doc.setFontSize(6.2); doc.setTextColor(60);
  doc.text(((s.tempat ? s.tempat + ', ' : '') + (s.tanggalLengkap || '')), x + w - 5, ty, { align: 'right' });
  var sigLineY = Math.min(ty + 12, y + h - 6);
  var sc1 = x + w * 0.28, sc2 = x + w * 0.75;
  if (s.ttdBase64) {
    try { doc.addImage('data:' + s.ttdMime + ';base64,' + s.ttdBase64, pdfImgFormat_(s.ttdMime), sc2 - 9, sigLineY - 9, 18, 8); } catch (e) { /* abaikan */ }
  }
  doc.setDrawColor(150); doc.setLineWidth(0.15);
  doc.line(sc1 - 12, sigLineY, sc1 + 12, sigLineY);
  doc.line(sc2 - 12, sigLineY, sc2 + 12, sigLineY);
  doc.setFontSize(5.8); doc.setTextColor(60);
  doc.text('Karyawan', sc1, sigLineY + 2.8, { align: 'center' });
  doc.text('(' + d.Nama + ')', sc1, sigLineY + 5.6, { align: 'center' });
  doc.text(s.jabatanManajer || 'Manager Operasional', sc2, sigLineY + 2.8, { align: 'center' });
  doc.text('(' + (s.namaManajer || '-') + ')', sc2, sigLineY + 5.6, { align: 'center' });
  doc.setTextColor(0);
}

// Slip gaji semua karyawan dalam 1 sheet (rapi, siap print), 1 karyawan per "halaman"
// (page break otomatis antar karyawan). Layout: 4 kolom (A+B = label, C+D = nilai).
function addSlipSectionHeader_(ws, r, text) {
  ws.mergeCells(r, 1, r, 4);
  var cell = ws.getCell(r, 1);
  cell.value = text;
  cell.font = { bold: true, size: 10, color: { argb: 'FFFFFFFF' } };
  cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E293B' } };
  cell.alignment = { horizontal: 'left', vertical: 'middle' };
  ws.getRow(r).height = 18;
  return r + 1;
}

function addSlipLabelRow_(ws, r, label, value, bold, highlight) {
  var style = getExportStyleFromState_();
  ws.mergeCells(r, 1, r, 2);
  var lc = ws.getCell(r, 1);
  lc.value = label;
  lc.font = { bold: !!bold, size: 10 };
  lc.alignment = { horizontal: 'left', vertical: 'middle' };
  ws.mergeCells(r, 3, r, 4);
  var vc = ws.getCell(r, 3);
  vc.value = value;
  vc.font = { bold: !!bold, size: 10 };
  vc.alignment = { horizontal: 'right', vertical: 'middle' };
  if (highlight) {
    lc.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: style.totalBg } };
    vc.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: style.totalBg } };
    lc.font = { bold: !!bold, size: 10, color: { argb: style.teksTotal } };
    vc.font = { bold: !!bold, size: 10, color: { argb: style.teksTotal } };
  }
  return r + 1;
}

function buildSlipGajiSemuaSheet_(wb, slipRes) {
  var style = getExportStyleFromState_();
  var items = (slipRes && slipRes.items) || [];
  var slip = (slipRes && slipRes.slip) || {};
  var ws = wb.addWorksheet('Slip Gaji Karyawan');
  ws.pageSetup = { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: 0.4, right: 0.4, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 } };
  ws.getColumn(1).width = 30;
  ws.getColumn(2).width = 14;
  ws.getColumn(3).width = 14;
  ws.getColumn(4).width = 22;

  if (!items.length) {
    ws.getCell(1, 1).value = 'Tidak ada data gaji untuk periode ini.';
    return;
  }

  var logoImageId = null;
  if (slipRes.logoBase64) {
    try {
      var ext = /png/i.test(slipRes.logoMime || '') ? 'png' : 'jpeg';
      logoImageId = wb.addImage({ base64: 'data:' + (slipRes.logoMime || 'image/png') + ';base64,' + slipRes.logoBase64, extension: ext });
    } catch (e) { logoImageId = null; }
  }

  var r = 1;
  items.forEach(function (d, idx) {
    if (logoImageId) {
      try { ws.addImage(logoImageId, { tl: { col: 0, row: r - 1 }, ext: { width: 90, height: 32 } }); } catch (e) { /* abaikan */ }
      r += 3;
    }

    ws.mergeCells(r, 1, r, 4);
    var cName = ws.getCell(r, 1); cName.value = slipRes.perusahaan || 'WONDERLAND PARK SAMARINDA';
    cName.font = { bold: true, size: 13, color: { argb: 'FF0F172A' } }; cName.alignment = { horizontal: 'center' };
    r++;
    ws.mergeCells(r, 1, r, 4);
    var cAddr = ws.getCell(r, 1); cAddr.value = slipRes.alamat || '';
    cAddr.font = { size: 9, italic: true, color: { argb: 'FF64748B' } }; cAddr.alignment = { horizontal: 'center' };
    r++;
    ws.mergeCells(r, 1, r, 4);
    var cTitle = ws.getCell(r, 1); cTitle.value = 'SLIP GAJI KARYAWAN';
    cTitle.font = { bold: true, size: 11, color: { argb: style.utama }, underline: true }; cTitle.alignment = { horizontal: 'center' };
    r++;
    ws.mergeCells(r, 1, r, 4);
    var cPeriode = ws.getCell(r, 1); cPeriode.value = 'Periode: ' + periodeRangeLabel(STATE.periode);
    cPeriode.font = { size: 9, color: { argb: 'FF64748B' } }; cPeriode.alignment = { horizontal: 'center' };
    r += 2;

    r = addSlipLabelRow_(ws, r, 'Nama', d.Nama, true);
    r = addSlipLabelRow_(ws, r, 'Jabatan', d.Jabatan);
    r = addSlipLabelRow_(ws, r, 'ID Karyawan', d.ID_Karyawan);
    r++;

    r = addSlipSectionHeader_(ws, r, 'PENDAPATAN');
    r = addSlipLabelRow_(ws, r, 'Gaji Pokok', fmtRupiah(d.Gaji_Pokok));
    r = addSlipLabelRow_(ws, r, 'Tunjangan Makan (' + d.Jumlah_Hadir + ' hari hadir)', fmtRupiah(d.Tunjangan_Makan));
    r = addSlipLabelRow_(ws, r, 'Tunjangan', fmtRupiah(d.Tunjangan));
    r = addSlipLabelRow_(ws, r, 'Reward', fmtRupiah(d.Reward));
    r = addSlipLabelRow_(ws, r, 'Bonus', fmtRupiah(d.Bonus));
    r = addSlipLabelRow_(ws, r, 'Tunjangan Bonus', fmtRupiah(d.Tunjangan_Bonus));
    r = addSlipLabelRow_(ws, r, 'Lembur (' + d.Total_Jam_Lembur + ' jam)', fmtRupiah(d.Lembur_Rupiah));
    r = addSlipLabelRow_(ws, r, 'Total Pendapatan', fmtRupiah(d.Total_Pendapatan), true, true);
    r++;

    r = addSlipSectionHeader_(ws, r, 'POTONGAN');
    r = addSlipLabelRow_(ws, r, 'Jumlah Izin', (d.Jumlah_Izin_Hari || 0) + ' hari');
    r = addSlipLabelRow_(ws, r, 'Potongan Izin', fmtRupiah(d.Potongan_Izin));
    r = addSlipLabelRow_(ws, r, 'Jumlah Alpha', (d.Jumlah_Alpha_Hari || 0) + ' hari');
    r = addSlipLabelRow_(ws, r, 'Potongan Alpha', fmtRupiah(d.Potongan_Alpha));
    r = addSlipLabelRow_(ws, r, 'Potongan Telat (' + d.Telat_Kena_Potong + ' dari ' + d.Jumlah_Telat + 'x)', fmtRupiah(d.Potongan_Telat));
    r = addSlipLabelRow_(ws, r, 'Potongan SP', fmtRupiah(d.Potongan_SP));
    r = addSlipLabelRow_(ws, r, 'Pemotongan Pelanggaran', fmtRupiah(d.Pemotongan_Pelanggaran));
    r = addSlipLabelRow_(ws, r, 'Potongan Pinjaman/Kasbon', fmtRupiah(d.Potongan_Pinjaman));
    r = addSlipLabelRow_(ws, r, 'Total Potongan', fmtRupiah(d.Total_Potongan), true, true);
    r++;

    ws.mergeCells(r, 1, r, 2);
    var lblCell = ws.getCell(r, 1);
    lblCell.value = 'GAJI DITERIMA';
    lblCell.font = { bold: true, size: 12, color: { argb: style.teksHeader } };
    lblCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: style.utama } };
    lblCell.alignment = { horizontal: 'left', vertical: 'middle' };
    ws.mergeCells(r, 3, r, 4);
    var valCell = ws.getCell(r, 3);
    valCell.value = fmtRupiah(d.Gaji_Bersih);
    valCell.font = { bold: true, size: 12, color: { argb: style.teksHeader } };
    valCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: style.utama } };
    valCell.alignment = { horizontal: 'right', vertical: 'middle' };
    ws.getRow(r).height = 22;
    r += 2;

    ws.mergeCells(r, 1, r, 4);
    var tglCell = ws.getCell(r, 1);
    tglCell.value = (slip.tempat ? slip.tempat + ', ' : '') + (slip.tanggalLengkap || '');
    tglCell.alignment = { horizontal: 'right' };
    tglCell.font = { size: 9 };
    r += 3;

    ws.mergeCells(r, 1, r, 2);
    var sigK = ws.getCell(r, 1);
    sigK.value = 'Karyawan';
    sigK.alignment = { horizontal: 'center' };
    sigK.border = { top: { style: 'thin', color: { argb: 'FF94A3B8' } } };
    ws.mergeCells(r, 3, r, 4);
    var sigM = ws.getCell(r, 3);
    sigM.value = slip.jabatanManajer || 'Manager Operasional';
    sigM.alignment = { horizontal: 'center' };
    sigM.border = { top: { style: 'thin', color: { argb: 'FF94A3B8' } } };
    r++;
    ws.mergeCells(r, 1, r, 2);
    var namaK = ws.getCell(r, 1); namaK.value = '(  ' + d.Nama + '  )'; namaK.alignment = { horizontal: 'center' };
    ws.mergeCells(r, 3, r, 4);
    var namaM = ws.getCell(r, 3); namaM.value = '(  ' + (slip.namaManajer || '-') + '  )'; namaM.alignment = { horizontal: 'center' };
    r += 3;

    if (idx < items.length - 1) {
      ws.getRow(r - 1).addPageBreak();
    }
  });
}

// Tanda Terima Gaji: 1 sheet daftar seluruh karyawan + kolom tanda tangan (garis bawah siap tanda tangan basah).
function buildTandaTerimaSheet_(wb, opts) {
  var data = opts.data || [];
  var headers = ['No', 'Nama', 'Jabatan', 'Jumlah Diterima', 'Tanda Tangan'];
  var totalCols = headers.length;
  var ws = wb.addWorksheet('Tanda Terima Gaji');
  addTitleRows_(ws, totalCols, opts.perusahaan || 'WONDERLAND PARK SAMARINDA', 'TANDA TERIMA GAJI KARYAWAN', 'Periode: ' + periodeRangeLabel(STATE.periode) + ' (' + STATE.periode + ')');

  var headerRowIdx = 5;
  var headerRow = ws.getRow(headerRowIdx);
  headers.forEach(function (h, i) { headerRow.getCell(i + 1).value = h; });
  styleHeaderRow_(headerRow, totalCols);
  ws.views = [{ state: 'frozen', ySplit: headerRowIdx }];

  data.forEach(function (d, idx) {
    var row = ws.getRow(headerRowIdx + 1 + idx);
    row.getCell(1).value = idx + 1; row.getCell(1).alignment = { horizontal: 'center', vertical: 'middle' };
    row.getCell(2).value = d.Nama; row.getCell(2).alignment = { horizontal: 'left', vertical: 'middle' };
    row.getCell(3).value = d.Jabatan; row.getCell(3).alignment = { horizontal: 'left', vertical: 'middle' };
    row.getCell(4).value = d.Gaji_Bersih; row.getCell(4).numFmt = '"Rp" #,##0'; row.getCell(4).alignment = { horizontal: 'right', vertical: 'middle' };
    row.getCell(5).value = '';
    for (var c = 1; c <= 5; c++) {
      row.getCell(c).border = THIN_BORDER_;
      row.getCell(c).font = { size: 10 };
    }
    row.getCell(5).border = { top: { style: 'thin', color: { argb: 'FFE2E8F0' } }, left: { style: 'thin', color: { argb: 'FFE2E8F0' } }, right: { style: 'thin', color: { argb: 'FFE2E8F0' } }, bottom: { style: 'thin', color: { argb: 'FF64748B' } } };
    if (idx % 2 === 1) {
      for (var cc = 1; cc <= 4; cc++) { if (!row.getCell(cc).fill) row.getCell(cc).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF8FAFC' } }; }
    }
    row.height = 26;
  });

  ws.getColumn(1).width = 6;
  ws.getColumn(2).width = 26;
  ws.getColumn(3).width = 20;
  ws.getColumn(4).width = 18;
  ws.getColumn(5).width = 24;
}

// Download 1 file xlsx berisi SEMUA sheet laporan gaji sekaligus: Absensi Harian, Gaji Tanpa
// Potongan, Gaji + Potongan, Rekap Lembur, Slip Gaji Karyawan (semua karyawan), dan Tanda Terima Gaji.
function unduhLaporanGajiLengkap_() {
  toast('Menyiapkan Laporan Gaji Karyawan (semua sheet)...', 'info');
  return Promise.all([
    gsRun('getAbsensiPeriode', STATE.token, STATE.periode),
    gsRun('getPayrollPeriode', STATE.token, STATE.periode),
    gsRun('getAllSlipGajiData', STATE.token, STATE.periode)
  ]).then(function (results) {
    var absensi = results[0], payroll = results[1], slipRes = results[2];
    if (!payroll.data || !payroll.data.length) { toast('Tidak ada data gaji untuk periode ini', 'error'); return; }
    var b = getBrandingFromState_();
    var wb = new ExcelJS.Workbook();
    wb.creator = b.perusahaan || 'Sistem Gaji';
    wb.created = new Date();

    buildAbsensiHarianSheet_(wb, { absensi: absensi, perusahaan: b.perusahaan });
    addPerhitunganSheetToWorkbook_(wb, 'Gaji Tanpa Potongan', buildExportTanpaPotongan_(payroll), b.perusahaan);
    addPerhitunganSheetToWorkbook_(wb, 'Gaji + Potongan', buildExportPotongan_(payroll), b.perusahaan);
    buildRekapLemburSheet_(wb, { absensi: absensi, perusahaan: b.perusahaan });
    buildSlipGajiSemuaSheet_(wb, slipRes);
    buildTandaTerimaSheet_(wb, { data: payroll.data, perusahaan: b.perusahaan });

    return downloadWorkbook_(wb, 'Laporan_Gaji_Karyawan_' + STATE.periode);
  }).catch(function (err) {
    toast('Gagal membuat laporan lengkap: ' + (err && err.message ? err.message : err), 'error');
  });
}

function downloadTemplateAbsensi() {
  var range = getPeriodeRange(STATE.periode);
  var dates = dateRangeArray(range.mulai, range.selesai);
  var aktif = STATE.karyawan.filter(function (k) { return k.Status === 'Aktif'; });
  var contohKode = ['P', 'P', 'O', 'I', 'S', 'P', 'P', 'T', 'P', 'A', 'C', 'P'];
  var rows = (aktif.length ? aktif : [{ ID_Karyawan: '', Nama: 'Contoh Nama Karyawan', Jabatan: 'Contoh Jabatan' }]).map(function (k, idx) {
    var row = { ID_Karyawan: k.ID_Karyawan || '', Nama: k.Nama, Posisi: k.Jabatan || '' };
    dates.forEach(function (d, i) { row[d] = idx === 0 ? contohKode[i % contohKode.length] : ''; });
    return row;
  });
  exportArrayToXlsx_(rows, 'Template_Import_Absensi_' + STATE.periode);
  toast('Kolom tanggal sudah sesuai periode ' + periodeRangeLabel(STATE.periode) + '. Isi dengan kode: ' + STATE.kodeAbsensi.map(function (k) { return k.Kode; }).join('/'), 'info');
}

function fmtDateTime_(v) {
  if (!v) return '-';
  var d = new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return d.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function kpiStatusRowHtml_(s, idx) {

    '<td><input class="kpi-kode" style="width:56px;text-transform:uppercase;font-weight:700;" maxlength="3" value="' + esc(s.Kode || '') + '"></td>' +

function renderExportStyleTab_(el) {
  var map = {};
  STATE.pengaturan.forEach(function (p) { map[p.Key] = p.Value; });
  function val(key) { return (map[key] !== undefined && map[key] !== null && map[key] !== '') ? map[key] : EXPORT_STYLE_DEFAULTS_[key]; }
  var zebraOn = String(val('EXPORT_ZEBRA_AKTIF')).toUpperCase() !== 'N' && String(val('EXPORT_ZEBRA_AKTIF')).toUpperCase() !== 'TIDAK' && val('EXPORT_ZEBRA_AKTIF') !== '0';

  function colorRow(key, label, desc) {
    var v = val(key);
    return '<div class="form-row"><label>' + esc(label) + (desc ? '<br><span style="font-weight:400;color:var(--muted);">' + esc(desc) + '</span>' : '') + '</label>' +
      '<div style="display:flex;align-items:center;gap:10px;">' +
        '<input type="color" class="exportstyle-color" data-key="' + esc(key) + '" value="' + esc(v) + '" style="width:46px;height:36px;padding:2px;border:1px solid var(--border);border-radius:6px;cursor:pointer;">' +
        '<input type="text" class="exportstyle-color-text" data-key="' + esc(key) + '" value="' + esc(v) + '" style="width:100px;font-family:monospace;">' +
      '</div></div>';
  }

  el.innerHTML =
    '<div class="card" style="max-width:640px;">' +
      '<div class="card-title">Style Export Excel</div>' +
      '<p style="font-size:12px;color:var(--muted);margin-top:-6px;">Atur sendiri tema warna untuk SEMUA hasil download Excel (.xlsx): Absensi Harian, Perhitungan Gaji, Rekap Lembur, Slip Gaji, Tanda Terima Gaji, dan Laporan Gaji Karyawan (Lengkap). Perubahan berlaku otomatis ke export berikutnya, tidak perlu edit file lagi.</p>' +
      '<h4 style="margin:18px 0 6px;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:6px;">Pratinjau</h4>' +
      '<div id="exportStylePreview" style="border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:12px;margin-bottom:16px;"></div>' +
      '<h4 style="margin:18px 0 6px;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:6px;">Warna</h4>' +
      colorRow('EXPORT_WARNA_UTAMA', 'Warna Utama / Header', 'Warna latar header tabel, judul laporan, dan kotak "GAJI DITERIMA" di slip gaji.') +
      colorRow('EXPORT_WARNA_TEKS_HEADER', 'Warna Teks Header', 'Warna teks di atas Warna Utama (header tabel & kotak Gaji Diterima).') +
      colorRow('EXPORT_WARNA_TOTAL', 'Warna Baris Total', 'Warna latar baris TOTAL/Total Pendapatan/Total Potongan dan sel jam lembur yang terisi.') +
      colorRow('EXPORT_WARNA_TEKS_TOTAL', 'Warna Teks Baris Total', '') +
      colorRow('EXPORT_WARNA_ZEBRA', 'Warna Baris Selang-seling', 'Warna latar baris genap agar tabel panjang lebih mudah dibaca.') +
      '<div class="form-row"><label><input type="checkbox" id="exportZebraAktif" ' + (zebraOn ? 'checked' : '') + ' style="width:auto;margin-right:8px;">Aktifkan baris selang-seling (zebra)</label></div>' +
      '<div class="toolbar" style="margin-bottom:0;margin-top:16px;">' +
        '<button class="btn btn-primary" id="btnSimpanExportStyle" type="button">Simpan Style Export</button>' +
        '<button class="btn btn-ghost" id="btnResetExportStyle" type="button">Kembalikan ke Default (Orange)</button>' +
      '</div>' +
    '</div>';

  function currentValues() {
    var v = {};
    Array.prototype.forEach.call(el.querySelectorAll('.exportstyle-color'), function (inp) { v[inp.getAttribute('data-key')] = inp.value; });
    v.EXPORT_ZEBRA_AKTIF = document.getElementById('exportZebraAktif').checked ? 'Y' : 'N';
    return v;
  }

  function renderPreview() {
    var v = currentValues();
    var prev = document.getElementById('exportStylePreview');
    prev.innerHTML =
      '<table style="width:100%;border-collapse:collapse;">' +
        '<tr>' +
          '<th style="background:' + v.EXPORT_WARNA_UTAMA + ';color:' + v.EXPORT_WARNA_TEKS_HEADER + ';padding:8px;font-weight:700;">Nama</th>' +
          '<th style="background:' + v.EXPORT_WARNA_UTAMA + ';color:' + v.EXPORT_WARNA_TEKS_HEADER + ';padding:8px;font-weight:700;">Gaji Bersih</th>' +
        '</tr>' +
        '<tr><td style="padding:8px;border-bottom:1px solid var(--border);">Contoh Karyawan 1</td><td style="padding:8px;border-bottom:1px solid var(--border);text-align:right;">Rp 3.500.000</td></tr>' +
        '<tr style="background:' + (v.EXPORT_ZEBRA_AKTIF === 'Y' ? v.EXPORT_WARNA_ZEBRA : '#fff') + ';"><td style="padding:8px;border-bottom:1px solid var(--border);">Contoh Karyawan 2</td><td style="padding:8px;border-bottom:1px solid var(--border);text-align:right;">Rp 3.200.000</td></tr>' +
        '<tr><td style="padding:8px;background:' + v.EXPORT_WARNA_TOTAL + ';color:' + v.EXPORT_WARNA_TEKS_TOTAL + ';font-weight:700;">TOTAL</td><td style="padding:8px;background:' + v.EXPORT_WARNA_TOTAL + ';color:' + v.EXPORT_WARNA_TEKS_TOTAL + ';font-weight:700;text-align:right;">Rp 6.700.000</td></tr>' +

      renderPreview();
    });

    inp.addEventListener('change', function () {

      var colorInp = el.querySelector('.exportstyle-color[data-key="' + inp.getAttribute('data-key') + '"]');
      if (colorInp) colorInp.value = v;
      renderPreview();
    });
  });
  document.getElementById('exportZebraAktif').addEventListener('change', renderPreview);
  renderPreview();

  document.getElementById('btnSimpanExportStyle').addEventListener('click', function () {
    var v = currentValues();
    var items = Object.keys(v).map(function (k) { return { Key: k, Value: v[k] }; });
    gsRun('savePengaturan', STATE.token, items).then(function (res) {
      toast(res.message, 'success');
      gsRun('getPengaturan', STATE.token).then(function (p) { STATE.pengaturan = p; });
    }).catch(function (err) { toast('Gagal: ' + (err.message || err), 'error'); });
  });

  document.getElementById('btnResetExportStyle').addEventListener('click', function () {
    var items = Object.keys(EXPORT_STYLE_DEFAULTS_).map(function (k) { return { Key: k, Value: EXPORT_STYLE_DEFAULTS_[k] }; });
    gsRun('savePengaturan', STATE.token, items).then(function (res) {
      toast('Style export dikembalikan ke default', 'success');
      gsRun('getPengaturan', STATE.token).then(function (p) { STATE.pengaturan = p; renderExportStyleTab_(el); });
    }).catch(function (err) { toast('Gagal: ' + (err.message || err), 'error'); });
  });

  applySettingsLock(el);
}

function renderPengaturan(content) {
  return Promise.all([

    '<div class="form-row"><label>Dihitung sebagai Telat?</label><select id="kdTelat"><option value="N" ' + (item && item.Hitung_Telat === 'N' ? 'selected' : '') + '>Tidak</option><option value="Y" ' + (item && item.Hitung_Telat === 'Y' ? 'selected' : '') + '>Ya</option></select></div>' +
    '<div class="form-row"><label>Nilai Hadir<br><span style="font-weight:400;color:var(--muted);">Porsi hari dihitung sebagai kehadiran: 1 = penuh, 0.5 = setengah hari, 0 = tidak dihitung</span></label><select id="kdNilaiHadir"><option value="1" ' + (item && Number(item.Nilai_Hadir) === 1 ? 'selected' : '') + '>1 (Hadir Penuh)</option><option value="0.5" ' + (item && Number(item.Nilai_Hadir) === 0.5 ? 'selected' : '') + '>0.5 (Setengah Hari)</option><option value="0" ' + (!item || !item.Nilai_Hadir ? 'selected' : '') + '>0 (Tidak Dihitung Hadir)</option></select></div>' +
    '<div class="form-row"><label>Nilai Izin<br><span style="font-weight:400;color:var(--muted);">Porsi hari dihitung sebagai Izin &amp; dipotong gaji harian sesuai porsi ini: 1 = izin penuh, 0.5 = setengah izin (mis. kode N), 0 = tidak dihitung izin</span></label><select id="kdNilaiIzin"><option value="1" ' + (item && Number(item.Nilai_Izin) === 1 ? 'selected' : '') + '>1 (Izin Penuh)</option><option value="0.5" ' + (item && Number(item.Nilai_Izin) === 0.5 ? 'selected' : '') + '>0.5 (Setengah Izin)</option><option value="0" ' + (!item || !item.Nilai_Izin ? 'selected' : '') + '>0 (Tidak Dihitung Izin)</option></select></div>' +
    '<div class="form-row"><label>Warna</label><input type="color" id="kdWarna" value="' + (item ? item.Warna : '#94a3b8') + '"></div>',
    '<button class="btn btn-ghost" type="button" onclick="closeModal()">Batal</button><button class="btn btn-primary" type="button" onclick="submitKode()">Simpan</button>'
  );
}
function submitKode() {
  var payload = {
    Kode: document.getElementById('kdKode').value.trim().toUpperCase(),
    Nama: document.getElementById('kdNama').value.trim(),
    Kategori: document.getElementById('kdKategori').value.trim(),
    Potong_Gaji: document.getElementById('kdPotong').value,
    Multiplier_Potong: document.getElementById('kdMultiplier').value,
    Hitung_Telat: document.getElementById('kdTelat').value,
    Nilai_Hadir: document.getElementById('kdNilaiHadir').value,
    Nilai_Izin: document.getElementById('kdNilaiIzin').value,
    Warna: document.getElementById('kdWarna').value
  };
  if (!payload.Kode) { toast('Kode wajib diisi', 'error'); return; }
  gsRun('saveKodeAbsensi', STATE.token, payload).then(function () {
    closeModal(); toast('Kode absensi tersimpan', 'success'); navigate('pengaturan');
  }).catch(function (err) { toast('Gagal: ' + (err.message || err), 'error'); });
}
function hapusKode(kode) {
  if (!confirm('Hapus kode "' + kode + '"?')) return;
  gsRun('deleteKodeAbsensi', STATE.token, kode).then(function () { toast('Kode dihapus', 'success'); navigate('pengaturan'); });
}

function openUserModal(username) {
  openModal(username ? 'Edit Akun' : 'Tambah Akun', '' +
    '<div class="form-row"><label>Username</label><input id="usUsername" value="' + esc(username || '') + '" ' + (username ? 'readonly' : '') + '></div>' +
    '<div class="form-row"><label>Password ' + (username ? '(kosongkan jika tidak diubah)' : '') + '</label><input type="password" id="usPassword"></div>' +
    '<div class="form-row"><label>Nama</label><input id="usNama"></div>' +
    '<div class="form-row"><label>Role</label><select id="usRole"><option>Owner</option><option>Admin</option><option>HR</option><option>Karyawan</option></select></div>' +
    '<div class="form-row"><label>ID Karyawan (untuk role Karyawan)</label><input id="usIdKaryawan"></div>' +
    '<div class="form-row"><label>Status</label><select id="usStatus"><option>Aktif</option><option>Nonaktif</option></select></div>',
    '<button class="btn btn-ghost" type="button" onclick="closeModal()">Batal</button><button class="btn btn-primary" type="button" onclick="submitUser(' + (username ? "'" + username + "'" : 'null') + ')">Simpan</button>'
  );
}
function submitUser(existingUsername) {
  var payload = {
    Username: document.getElementById('usUsername').value.trim(),
    Password: document.getElementById('usPassword').value,
    Nama: document.getElementById('usNama').value.trim(),
    Role: document.getElementById('usRole').value,
    ID_Karyawan: document.getElementById('usIdKaryawan').value.trim(),
    Status: document.getElementById('usStatus').value
  };
  if (!payload.Username || !payload.Nama) { toast('Username dan Nama wajib diisi', 'error'); return; }
  gsRun('saveUser', STATE.token, payload).then(function () {
    closeModal(); toast('Akun tersimpan', 'success'); navigate('pengaturan');
  }).catch(function (err) { toast('Gagal: ' + (err.message || err), 'error'); });
}
function hapusUser(username) {
  if (!confirm('Hapus akun "' + username + '"?')) return;
  gsRun('deleteUser', STATE.token, username).then(function () { toast('Akun dihapus', 'success'); navigate('pengaturan'); });
}

/* ============================================================================
   PWA: service worker + tombol pasang aplikasi
   ============================================================================ */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW gagal didaftarkan', e); });
  });
}
var deferredInstallPrompt_ = null;
function isStandalone_() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
function isIOS_() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function updateInstallUI_() {
  var can = !isStandalone_() && (!!deferredInstallPrompt_ || isIOS_());
  ['installAppBtn', 'installAppBtn2'].forEach(function (id) {
    var b = document.getElementById(id); if (b) b.style.display = can ? '' : 'none';
  });
}
function installApp_() {
  if (deferredInstallPrompt_) {
    deferredInstallPrompt_.prompt();
    deferredInstallPrompt_.userChoice.finally(function () { deferredInstallPrompt_ = null; updateInstallUI_(); });
  } else if (isIOS_()) {
    openModal('Pasang di iPhone / iPad',
      '<ol style="padding-left:18px;line-height:1.9;">' +
      '<li>Buka halaman ini di <b>Safari</b> (bukan Chrome/aplikasi lain).</li>' +
      '<li>Ketuk tombol <b>Bagikan</b> <span style="font-size:18px;">⬆️</span> di bagian bawah layar.</li>' +
      '<li>Pilih <b>Tambah ke Layar Utama</b>, lalu ketuk <b>Tambah</b>.</li></ol>' +
      '<div class="alert alert-info">Setelah itu aplikasi muncul sebagai ikon "Gaji WLP" di layar utama dan terbuka layar penuh.</div>',
      '<button class="btn btn-primary" type="button" onclick="closeModal()">Mengerti</button>');
  }
}
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferredInstallPrompt_ = e;
  updateInstallUI_();
});
window.addEventListener('appinstalled', function () { deferredInstallPrompt_ = null; updateInstallUI_(); });
['installAppBtn', 'installAppBtn2'].forEach(function (id) {
  document.getElementById(id).addEventListener('click', installApp_);
});
updateInstallUI_();
if (window.matchMedia) {
  var mqStandalone_ = window.matchMedia('(display-mode: standalone)');
  if (mqStandalone_.addEventListener) mqStandalone_.addEventListener('change', updateInstallUI_);
}
</script>
